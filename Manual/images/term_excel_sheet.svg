<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540">
  <defs>
    <filter id="sheetShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.14" />
    </filter>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="startBtnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#BBF7D0" />
    </linearGradient>
    <linearGradient id="stepBtnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </linearGradient>
    <style>
      .ui { font-family: 'Meiryo UI', 'Yu Gothic UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .col-hdr { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1; }
      .col-txt { font-family: 'Segoe UI', sans-serif; font-size: 11.5px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .seq-hdr { fill: #DCE6F2; stroke: #64748B; stroke-width: 1; }
      .seq-hdr-txt { font-family: 'Meiryo UI', 'Yu Gothic UI', sans-serif; font-size: 11px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .seq-val { fill: #FFFFFF; stroke: #64748B; stroke-width: 1; }
      .seq-val-txt { font-family: 'Meiryo UI', 'Yu Gothic UI', sans-serif; font-size: 11.5px; fill: #0F172A; }
      .empty-cell { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .badge-circle { fill: #E8590C; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; font-size: 12.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .callout-box { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.3; rx: 6; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="980" height="540" fill="#F8FAFC" rx="10" />

  <!-- ワークシート枠 -->
  <g filter="url(#sheetShadow)">
    <rect x="20" y="18" width="940" height="404" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" />
  </g>

  <!-- 列幅定義: 行番号(38) | A:92 | B:92 | C:158 | D:142 | E:136 | F:136 | G:146 = 940 -->
  <g transform="translate(20, 18)">
    <!-- 列ヘッダ行 (A〜G) -->
    <rect x="0" y="0" width="38" height="24" class="col-hdr" />
    <rect x="38" y="0" width="92" height="24" class="col-hdr" />
    <rect x="130" y="0" width="92" height="24" class="col-hdr" />
    <rect x="222" y="0" width="158" height="24" class="col-hdr" />
    <rect x="380" y="0" width="142" height="24" class="col-hdr" />
    <rect x="522" y="0" width="136" height="24" class="col-hdr" />
    <rect x="658" y="0" width="136" height="24" class="col-hdr" />
    <rect x="794" y="0" width="146" height="24" class="col-hdr" />

    <text x="84" y="16" class="col-txt">A (基準列)</text>
    <text x="176" y="16" class="col-txt">B (+1)</text>
    <text x="301" y="16" class="col-txt">C (+2)</text>
    <text x="451" y="16" class="col-txt">D (+3)</text>
    <text x="590" y="16" class="col-txt">E (+4 引数1)</text>
    <text x="726" y="16" class="col-txt">F (+5 引数2)</text>
    <text x="867" y="16" class="col-txt">G (結果転記セル例)</text>

    <!-- 行1: 空行 -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="38" height="22" class="col-hdr" />
      <text x="19" y="15" class="col-txt">1</text>
      <rect x="38" y="0" width="902" height="22" class="empty-cell" />
      <text x="46" y="15" class="ui" font-size="11" font-weight="700" fill="#1E3A8A">■ Modbus / シリアル通信 自動検査シーケンスシート（標準 .xlsx 形式）</text>
    </g>

    <!-- 行2〜3: ①② 4列制御ブロック (Start / Step / 開始位置 / 現在位置) + 右側 名前定義セル例 -->
    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="38" height="25" class="col-hdr" />
      <text x="19" y="17" class="col-txt">2</text>
      <rect x="0" y="25" width="38" height="27" class="col-hdr" />
      <text x="19" y="43" class="col-txt">3</text>

      <!-- A2:A3 [Start] 縦2行結合ボタン -->
      <rect x="38" y="0" width="92" height="52" fill="#F0F0F0" stroke="#64748B" stroke-width="1" />
      <rect x="43" y="5" width="82" height="42" rx="4" fill="url(#startBtnGrad)" stroke="#16A34A" stroke-width="1.5" />
      <text x="84" y="31" class="ui" font-size="13" font-weight="700" fill="#14532D" text-anchor="middle">Start</text>

      <!-- B2:B3 [Step] 縦2行結合ボタン -->
      <rect x="130" y="0" width="92" height="52" fill="#F0F0F0" stroke="#64748B" stroke-width="1" />
      <rect x="135" y="5" width="82" height="42" rx="4" fill="url(#stepBtnGrad)" stroke="#2563EB" stroke-width="1.5" />
      <text x="176" y="31" class="ui" font-size="13" font-weight="700" fill="#1E3A8A" text-anchor="middle">Step</text>

      <!-- C2/C3 開始位置 -->
      <rect x="222" y="0" width="158" height="25" class="seq-hdr" />
      <text x="301" y="17" class="seq-hdr-txt">開始位置</text>
      <rect x="222" y="25" width="158" height="27" class="seq-val" />
      <text x="232" y="43" class="mono" font-size="12" font-weight="700" fill="#0F172A">A5</text>
      <rect x="358" y="27" width="20" height="23" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <polygon points="364,36 372,36 368,42" fill="#475569" />

      <!-- D2/D3 現在位置 -->
      <rect x="380" y="0" width="142" height="25" class="seq-hdr" />
      <text x="451" y="17" class="seq-hdr-txt">現在位置</text>
      <rect x="380" y="25" width="142" height="27" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.4" />
      <text x="390" y="43" class="mono" font-size="12" font-weight="700" fill="#854D0E">A7</text>
      <text x="424" y="42" class="ui" font-size="10" fill="#A16207">(実行中番地)</text>

      <!-- E2:F3 空白 / G2:G3 名前定義セル転記先 -->
      <rect x="522" y="0" width="272" height="52" class="empty-cell" />
      <rect x="794" y="0" width="146" height="25" fill="#ECFDF5" stroke="#10B981" stroke-width="1" />
      <text x="867" y="17" class="ui" font-size="10.5" font-weight="700" fill="#065F46" text-anchor="middle">名前定義: 応答データ_CH1</text>
      <rect x="794" y="25" width="146" height="27" fill="#FFFFFF" stroke="#10B981" stroke-width="1.4" />
      <text x="867" y="43" class="mono" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">2485</text>
    </g>

    <!-- 行4: 空行 -->
    <g transform="translate(0, 98)">
      <rect x="0" y="0" width="38" height="20" class="col-hdr" />
      <text x="19" y="14" class="col-txt">4</text>
      <rect x="38" y="0" width="902" height="20" class="empty-cell" />
    </g>

    <!-- 行5〜6: シーケンス1行目 (P1:Modbus_Open) -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="38" height="24" class="col-hdr" />
      <text x="19" y="16" class="col-txt">5</text>
      <rect x="0" y="24" width="38" height="26" class="col-hdr" />
      <text x="19" y="41" class="col-txt">6</text>

      <!-- A5:A6 [実行] -->
      <rect x="38" y="0" width="92" height="50" fill="#F0F0F0" stroke="#64748B" stroke-width="1" />
      <rect x="45" y="6" width="78" height="38" rx="4" fill="url(#btnGrad)" stroke="#64748B" stroke-width="1.2" />
      <text x="84" y="29" class="ui" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">実行</text>

      <!-- B5/B6 Wait(ms) -->
      <rect x="130" y="0" width="92" height="24" class="seq-hdr" />
      <text x="176" y="16" class="seq-hdr-txt">Wait(ms)</text>
      <rect x="130" y="24" width="92" height="26" class="seq-val" />
      <text x="212" y="41" class="mono" font-size="12" fill="#0F172A" text-anchor="end">0</text>

      <!-- C5/C6 Command -->
      <rect x="222" y="0" width="158" height="24" class="seq-hdr" />
      <text x="301" y="16" class="seq-hdr-txt">Command</text>
      <rect x="222" y="24" width="158" height="26" class="seq-val" />
      <text x="230" y="41" class="mono" font-size="11.5" font-weight="700" fill="#1E3A8A">P1:PORT_OPEN</text>
      <rect x="358" y="26" width="20" height="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <polygon points="364,34 372,34 368,40" fill="#475569" />

      <!-- D5/D6 Result -->
      <rect x="380" y="0" width="142" height="24" class="seq-hdr" />
      <text x="451" y="16" class="seq-hdr-txt">Result</text>
      <rect x="380" y="24" width="142" height="26" class="seq-val" />

      <!-- E5:G6 空欄 -->
      <rect x="522" y="0" width="418" height="50" class="empty-cell" />
    </g>

    <!-- 行7〜8: ③④ シーケンス2行目 (P1:REG_READ + 公開パラメータ展開 + 名前定義転記) -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="38" height="24" class="col-hdr" />
      <text x="19" y="16" class="col-txt">7</text>
      <rect x="0" y="24" width="38" height="26" class="col-hdr" />
      <text x="19" y="41" class="col-txt">8</text>

      <rect x="38" y="0" width="92" height="50" fill="#F0F0F0" stroke="#64748B" stroke-width="1" />
      <rect x="45" y="6" width="78" height="38" rx="4" fill="url(#btnGrad)" stroke="#2563EB" stroke-width="1.5" />
      <text x="84" y="29" class="ui" font-size="12" font-weight="700" fill="#1E3A8A" text-anchor="middle">実行</text>

      <rect x="130" y="0" width="92" height="24" class="seq-hdr" />
      <text x="176" y="16" class="seq-hdr-txt">Wait(ms)</text>
      <rect x="130" y="24" width="92" height="26" class="seq-val" />
      <text x="212" y="41" class="mono" font-size="12" fill="#0F172A" text-anchor="end">100</text>

      <rect x="222" y="0" width="158" height="24" class="seq-hdr" />
      <text x="301" y="16" class="seq-hdr-txt">Command</text>
      <rect x="222" y="24" width="158" height="26" class="seq-val" />
      <text x="230" y="41" class="mono" font-size="11.5" font-weight="700" fill="#1E3A8A">P1:REG_READ</text>
      <rect x="358" y="26" width="20" height="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <polygon points="364,34 372,34 368,40" fill="#475569" />

      <rect x="380" y="0" width="142" height="24" class="seq-hdr" />
      <text x="451" y="16" class="seq-hdr-txt">Result</text>
      <rect x="380" y="24" width="142" height="26" fill="#ECFDF5" stroke="#10B981" stroke-width="1.3" />
      <text x="388" y="41" class="ui" font-size="11" font-weight="700" fill="#065F46">応答データ_CH1</text>

      <!-- E7/E8 引数1 (List型ドロップダウン) -->
      <rect x="522" y="0" width="136" height="24" class="seq-hdr" />
      <text x="590" y="16" class="seq-hdr-txt">ファンクション</text>
      <rect x="522" y="24" width="136" height="26" class="seq-val" />
      <text x="530" y="41" class="mono" font-size="11.5" fill="#0F172A">03:保持レジスタ</text>
      <rect x="636" y="26" width="20" height="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <polygon points="642,34 650,34 646,40" fill="#475569" />

      <!-- F7/F8 引数2 -->
      <rect x="658" y="0" width="136" height="24" class="seq-hdr" />
      <text x="726" y="16" class="seq-hdr-txt">先頭アドレス</text>
      <rect x="658" y="24" width="136" height="26" class="seq-val" />
      <text x="784" y="41" class="mono" font-size="12" fill="#0F172A" text-anchor="end">40001</text>

      <rect x="794" y="0" width="146" height="50" class="empty-cell" />
    </g>

    <!-- 行9〜10: ⑤ シーケンス3行目 (条件分岐ジャンプ Excel_Judge 連携) -->
    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="38" height="24" class="col-hdr" />
      <text x="19" y="16" class="col-txt">9</text>
      <rect x="0" y="24" width="38" height="26" class="col-hdr" />
      <text x="19" y="41" class="col-txt">10</text>

      <rect x="38" y="0" width="92" height="50" fill="#F0F0F0" stroke="#64748B" stroke-width="1" />
      <rect x="45" y="6" width="78" height="38" rx="4" fill="url(#btnGrad)" stroke="#64748B" stroke-width="1.2" />
      <text x="84" y="29" class="ui" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">実行</text>

      <rect x="130" y="0" width="92" height="24" class="seq-hdr" />
      <text x="176" y="16" class="seq-hdr-txt">Wait(ms)</text>
      <rect x="130" y="24" width="92" height="26" class="seq-val" />
      <text x="212" y="41" class="mono" font-size="12" fill="#0F172A" text-anchor="end">0</text>

      <rect x="222" y="0" width="158" height="24" class="seq-hdr" />
      <text x="301" y="16" class="seq-hdr-txt">Command</text>
      <rect x="222" y="24" width="158" height="26" class="seq-val" />
      <text x="230" y="41" class="mono" font-size="11.5" font-weight="700" fill="#1E3A8A">P1:JUDGE_BRANCH</text>
      <rect x="358" y="26" width="20" height="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <polygon points="364,34 372,34 368,40" fill="#475569" />

      <rect x="380" y="0" width="142" height="24" class="seq-hdr" />
      <text x="451" y="16" class="seq-hdr-txt">Result</text>
      <rect x="380" y="24" width="142" height="26" class="seq-val" />
      <text x="388" y="41" class="mono" font-size="11.5" fill="#047857">OK</text>

      <!-- E9/E10 上限閾値 -->
      <rect x="522" y="0" width="136" height="24" class="seq-hdr" />
      <text x="590" y="16" class="seq-hdr-txt">上限閾値</text>
      <rect x="522" y="24" width="136" height="26" class="seq-val" />
      <text x="648" y="41" class="mono" font-size="12" fill="#0F172A" text-anchor="end">3000</text>

      <!-- F9/F10 NG時ジャンプ先 (ボタン番地候補リスト自動付与) -->
      <rect x="658" y="0" width="136" height="24" class="seq-hdr" />
      <text x="726" y="16" class="seq-hdr-txt">NG時遷移先</text>
      <rect x="658" y="24" width="136" height="26" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3" />
      <text x="668" y="41" class="mono" font-size="12" font-weight="700" fill="#1D4ED8">A11</text>
      <rect x="772" y="26" width="20" height="22" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
      <polygon points="778,34 786,34 782,40" fill="#1E40AF" />

      <rect x="794" y="0" width="146" height="50" class="empty-cell" />
    </g>

    <!-- 行11〜12: シーケンス4行目 (クローズ処理) -->
    <g transform="translate(0, 268)">
      <rect x="0" y="0" width="38" height="24" class="col-hdr" />
      <text x="19" y="16" class="col-txt">11</text>
      <rect x="0" y="24" width="38" height="26" class="col-hdr" />
      <text x="19" y="41" class="col-txt">12</text>

      <rect x="38" y="0" width="92" height="50" fill="#F0F0F0" stroke="#64748B" stroke-width="1" />
      <rect x="45" y="6" width="78" height="38" rx="4" fill="url(#btnGrad)" stroke="#64748B" stroke-width="1.2" />
      <text x="84" y="29" class="ui" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">実行</text>

      <rect x="130" y="0" width="92" height="24" class="seq-hdr" />
      <text x="176" y="16" class="seq-hdr-txt">Wait(ms)</text>
      <rect x="130" y="24" width="92" height="26" class="seq-val" />
      <text x="212" y="41" class="mono" font-size="12" fill="#0F172A" text-anchor="end">0</text>

      <rect x="222" y="0" width="158" height="24" class="seq-hdr" />
      <text x="301" y="16" class="seq-hdr-txt">Command</text>
      <rect x="222" y="24" width="158" height="26" class="seq-val" />
      <text x="230" y="41" class="mono" font-size="11.5" font-weight="700" fill="#B91C1C">P2:PORT_CLOSE</text>
      <rect x="358" y="26" width="20" height="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <polygon points="364,34 372,34 368,40" fill="#475569" />

      <rect x="380" y="0" width="142" height="24" class="seq-hdr" />
      <text x="451" y="16" class="seq-hdr-txt">Result</text>
      <rect x="380" y="24" width="142" height="26" class="seq-val" />

      <rect x="522" y="0" width="418" height="50" class="empty-cell" />
    </g>

    <!-- 名前定義セル転記の破線矢印 (D8 -> G3) -->
    <path d="M 522 206 C 640 206, 750 85, 792 85" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="5 3" />
    <polygon points="788,80 798,85 788,90" fill="#10B981" />

    <!-- 下部シートタブバー -->
    <rect x="0" y="376" width="940" height="28" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <rect x="44" y="376" width="120" height="26" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
    <text x="104" y="393" class="ui" font-size="11.5" font-weight="700" fill="#185C37" text-anchor="middle">検査シーケンス1</text>
    <line x1="48" y1="400" x2="160" y2="400" stroke="#185C37" stroke-width="2.5" />
  </g>

  <!-- 解説フッターボックス -->
  <rect x="20" y="434" width="940" height="92" class="callout-box" />
  <text x="38" y="457" class="ui" font-size="11.5" font-weight="700" fill="#92400E">① Start / Step ボタン（2行結合） ＋ ② 開始位置・現在位置（4列制御ブロック）</text>
  <text x="52" y="476" class="ui" font-size="11" fill="#451A03">・Start は「現在位置」（空欄時は「開始位置」）から連続実行・途中再開し、Step は 1 行実行して次の遷移先番地を「現在位置」へ記録します。</text>
  <text x="38" y="497" class="ui" font-size="11.5" font-weight="700" fill="#92400E">③ 単体「実行」行（2行1ステップ） ＋ ④ Result 名前定義セル転記 ＋ ⑤ 公開パラメータ列（Work型除外・遷移先候補リスト自動付与）</text>
  <text x="52" y="515" class="ui" font-size="11" fill="#451A03">・Command にタスク接頭辞（P1:, P2: 等）を指定して複数ポートを混在制御でき、Result に名前定義を入れると指定先セルへ自動転記されます。</text>

  <!-- 番号バッジ -->
  <g>
    <circle cx="62" cy="66" r="11" class="badge-circle" />
    <text x="62" y="66" class="badge-num">1</text>

    <circle cx="404" cy="66" r="11" class="badge-circle" />
    <text x="404" y="66" class="badge-num">2</text>

    <circle cx="62" cy="188" r="11" class="badge-circle" />
    <text x="62" y="188" class="badge-num">3</text>

    <circle cx="404" cy="188" r="11" class="badge-circle" />
    <text x="404" y="188" class="badge-num">4</text>

    <circle cx="682" cy="238" r="11" class="badge-circle" />
    <text x="682" y="238" class="badge-num">5</text>
  </g>
</svg>
