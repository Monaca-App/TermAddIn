<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="excelHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#185C37" />
      <stop offset="100%" stop-color="#217346" />
    </linearGradient>
    <linearGradient id="dlgTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .badge-circle { fill: #E8590C; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; font-size: 12.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .callout-box { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.3; rx: 6; }
      .callout-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11.5px; font-weight: 700; fill: #92400E; }
      .rib-btn { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 5; }
      .rib-btn-hi { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 1.4; rx: 5; }
      .rib-lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 600; fill: #1E293B; text-anchor: middle; }
      .grp-lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 700; fill: #64748B; text-anchor: middle; }
    </style>
  </defs>

  <!-- 背景キャンバス -->
  <rect x="0" y="0" width="960" height="430" fill="#F8FAFC" rx="10" />

  <!-- Excel ウィンドウ上部フレーム -->
  <g filter="url(#winShadow)">
    <rect x="22" y="20" width="916" height="202" rx="7" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.4" />
    <path d="M 22 27 Q 22 20 29 20 L 931 20 Q 938 20 938 27 L 938 50 L 22 50 Z" fill="url(#excelHeader)" />
  </g>

  <!-- Excel タイトルバー -->
  <rect x="34" y="27" width="16" height="16" rx="3" fill="#FFFFFF" opacity="0.92" />
  <text x="42" y="39" class="ui" font-size="11" font-weight="700" fill="#185C37" text-anchor="middle">X</text>
  <text x="60" y="39" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">通信検査シーケンス.xlsx - Excel</text>

  <!-- リボンタブ行 -->
  <rect x="23" y="50" width="914" height="28" fill="#217346" />
  <text x="46" y="68" class="ui" font-size="12" fill="#E2E8F0">ファイル</text>
  <text x="108" y="68" class="ui" font-size="12" fill="#E2E8F0">ホーム</text>
  <text x="164" y="68" class="ui" font-size="12" fill="#E2E8F0">挿入</text>
  <text x="212" y="68" class="ui" font-size="12" fill="#E2E8F0">データ</text>
  <text x="266" y="68" class="ui" font-size="12" fill="#E2E8F0">表示</text>
  <!-- アクティブタブ: アドイン -->
  <path d="M 312 78 L 312 54 Q 312 50 316 50 L 384 50 Q 388 50 388 54 L 388 78 Z" fill="#F8FAFC" />
  <text x="350" y="68" class="ui" font-size="12" font-weight="700" fill="#185C37" text-anchor="middle">アドイン</text>
  <line x1="320" y1="76" x2="380" y2="76" stroke="#185C37" stroke-width="2.5" />

  <!-- リボン本体領域 -->
  <rect x="23" y="78" width="914" height="106" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />

  <!-- ② 共通グループ: ツール (tool) -->
  <g transform="translate(36, 84)">
    <!-- ボタン1: マニュアル配置 -->
    <rect x="0" y="0" width="90" height="72" class="rib-btn" />
    <rect x="33" y="10" width="24" height="28" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6" />
    <line x1="38" y1="17" x2="52" y2="17" stroke="#2563EB" stroke-width="1.5" />
    <line x1="38" y1="23" x2="52" y2="23" stroke="#2563EB" stroke-width="1.5" />
    <line x1="38" y1="29" x2="48" y2="29" stroke="#2563EB" stroke-width="1.5" />
    <text x="45" y="57" class="rib-lbl">マニュアル配置</text>

    <!-- ボタン2: スタイル保存 -->
    <rect x="98" y="0" width="84" height="72" class="rib-btn" />
    <rect x="128" y="10" width="24" height="26" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6" />
    <rect x="133" y="10" width="14" height="9" fill="#FDE68A" stroke="#D97706" stroke-width="1.2" />
    <rect x="132" y="24" width="16" height="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" />
    <text x="140" y="57" class="rib-lbl">スタイル保存</text>

    <!-- ボタン3: Startボタン配置 -->
    <rect x="190" y="0" width="98" height="72" class="rib-btn" />
    <circle cx="239" cy="23" r="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" />
    <polygon points="235,16 247,23 235,30" fill="#16A34A" />
    <text x="239" y="57" class="rib-lbl">Startボタン配置</text>

    <!-- ボタン4: シーケンス削除 -->
    <rect x="296" y="0" width="90" height="72" class="rib-btn" />
    <circle cx="341" cy="23" r="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6" />
    <path d="M 335 17 L 347 29 M 347 17 L 335 29" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" />
    <text x="341" y="57" class="rib-lbl">シーケンス削除</text>

    <!-- グループ名ラベル -->
    <text x="193" y="90" class="grp-lbl">ツール</text>
  </g>

  <!-- グループ区切り線 -->
  <line x1="436" y1="86" x2="436" y2="176" stroke="#CBD5E1" stroke-width="1.4" />

  <!-- ③ Term専用グループ: Term制御 (Term) -->
  <g transform="translate(450, 84)">
    <!-- ボタン5: ツール起動 -->
    <rect x="0" y="0" width="88" height="72" class="rib-btn-hi" />
    <rect x="28" y="10" width="32" height="24" rx="3" fill="#1E293B" stroke="#2563EB" stroke-width="1.6" />
    <text x="33" y="25" class="mono" font-size="10" font-weight="700" fill="#38BDF8">&gt;_</text>
    <line x1="36" y1="38" x2="52" y2="38" stroke="#475569" stroke-width="2" />
    <text x="44" y="57" class="rib-lbl" fill="#1D4ED8">ツール起動</text>

    <!-- ボタン6: シーケンス配置 -->
    <rect x="96" y="0" width="92" height="72" class="rib-btn-hi" />
    <rect x="126" y="10" width="32" height="25" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6" />
    <rect x="126" y="10" width="32" height="8" fill="#DBEAFE" />
    <line x1="126" y1="26" x2="158" y2="26" stroke="#93C5FD" stroke-width="1.2" />
    <circle cx="155" cy="32" r="7" fill="#16A34A" />
    <path d="M 155 28 L 155 36 M 151 32 L 159 32" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
    <text x="142" y="57" class="rib-lbl" fill="#1D4ED8">シーケンス配置</text>

    <!-- グループ名ラベル -->
    <text x="94" y="90" class="grp-lbl">Term制御</text>
  </g>

  <!-- グループ区切り線 (共存イメージ点線枠) -->
  <line x1="654" y1="86" x2="654" y2="176" stroke="#CBD5E1" stroke-width="1.4" />
  <rect x="668" y="88" width="254" height="84" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="4 3" stroke-width="1.2" />
  <text x="795" y="114" class="ui" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">💡 複数アドイン共存時の自動調停</text>
  <text x="795" y="134" class="ui" font-size="10.5" fill="#475569" text-anchor="middle">GpibAddIn 同時導入時は共通「ツール」が</text>
  <text x="795" y="151" class="ui" font-size="10.5" fill="#475569" text-anchor="middle">1つに統合され、右隣へ制御グループが並びます</text>

  <!-- 数式バー簡易表示 -->
  <rect x="23" y="184" width="914" height="37" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <rect x="32" y="191" width="68" height="22" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="66" y="206" class="mono" font-size="11.5" fill="#334155" text-anchor="middle">A5</text>
  <text x="116" y="206" class="mono" font-size="12" fill="#64748B">fx</text>
  <rect x="138" y="191" width="786" height="22" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="148" y="206" class="ui" font-size="11" fill="#64748B">標準 .xlsx 形式のまま VBA コード不要でシーケンスを作成・保存・実行</text>

  <!-- 矢印: ボタン押下 -> タスク番号の選択ダイアログ -->
  <path d="M 544 162 L 544 246 L 492 246" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 3" />
  <polygon points="494,241 484,246 494,251" fill="#2563EB" />

  <!-- ④ タスク番号の選択ダイアログ (TaskSelectDialog: 340x150相当) -->
  <g transform="translate(120, 240)" filter="url(#winShadow)">
    <rect x="0" y="0" width="360" height="168" rx="6" fill="#F3F4F6" stroke="#64748B" stroke-width="1.4" />
    <path d="M 0 6 Q 0 0 6 0 L 354 0 Q 360 0 360 6 L 360 30 L 0 30 Z" fill="url(#dlgTitle)" />
    <text x="14" y="20" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">タスク番号の選択</text>
    <!-- 右上 × のみ (FixedDialog) -->
    <line x1="336" y1="10" x2="346" y2="20" stroke="#FFFFFF" stroke-width="1.6" />
    <line x1="346" y1="10" x2="336" y2="20" stroke="#FFFFFF" stroke-width="1.6" />

    <!-- ラベル -->
    <text x="20" y="56" class="ui" font-size="12" font-weight="600" fill="#1E293B">対象のタスク番号 (P1～P10) を選択してください:</text>

    <!-- コンボボックス -->
    <rect x="20" y="70" width="320" height="28" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
    <text x="30" y="89" class="mono" font-size="12" font-weight="700" fill="#0F172A">タスク P1  (COM / Term-1)</text>
    <rect x="314" y="71" width="25" height="26" fill="#EFF6FF" />
    <polygon points="322,81 332,81 327,88" fill="#1E40AF" />

    <!-- OK / キャンセル -->
    <rect x="172" y="122" width="80" height="30" rx="4" fill="#2563EB" stroke="#1D4ED8" stroke-width="1" />
    <text x="212" y="142" class="ui" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">OK</text>
    <rect x="260" y="122" width="80" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
    <text x="300" y="142" class="ui" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">キャンセル</text>
  </g>

  <!-- 右下解説ボックス -->
  <rect x="506" y="256" width="430" height="142" class="callout-box" />
  <text x="522" y="280" class="callout-txt">① 「アドイン」タブ ➔ ② 共通「ツール」／ ③「Term制御」</text>
  <text x="522" y="302" class="ui" font-size="11.5" fill="#451A03">・ツール起動／シーケンス配置／Startボタン配置の実行時に</text>
  <text x="522" y="320" class="ui" font-size="11.5" fill="#451A03">  ④「タスク番号の選択」が開き、最大 10 系統（P1～P10）の</text>
  <text x="522" y="338" class="ui" font-size="11.5" fill="#451A03">  独立した通信タスクを 1 つのブック上で同時制御できます。</text>
  <text x="522" y="362" class="ui" font-size="11.5" fill="#451A03">・起動済みのタスク番号を選んだ場合は多重起動せず、既存の</text>
  <text x="522" y="380" class="ui" font-size="11.5" fill="#451A03">  Monaca Term 画面を最前面へアクティブ化します。</text>

  <!-- 番号バッジ -->
  <g>
    <circle cx="308" cy="52" r="11" class="badge-circle" />
    <text x="308" y="52" class="badge-num">1</text>

    <circle cx="38" cy="84" r="11" class="badge-circle" />
    <text x="38" y="84" class="badge-num">2</text>

    <circle cx="450" cy="84" r="11" class="badge-circle" />
    <text x="450" y="84" class="badge-num">3</text>

    <circle cx="120" cy="240" r="11" class="badge-circle" />
    <text x="120" y="240" class="badge-num">4</text>
  </g>
</svg>
