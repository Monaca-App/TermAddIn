<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .grp-box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.2; rx: 4; }
      .grp-lbl-bg { fill: #F3F4F6; }
      .grp-lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .input-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 3; }
      .btn-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 4; }
      .btn-pri { fill: #2563EB; stroke: #1D4ED8; stroke-width: 1; rx: 4; }
      .badge-circle { fill: #E8590C; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; font-size: 12.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .callout-box { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.3; rx: 6; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="980" height="540" fill="#F8FAFC" rx="10" />

  <!-- ========================================================= -->
  <!-- 左ウィンドウ: 第1タブ「コマンド集」表示状態 (448 x 412)    -->
  <!-- ========================================================= -->
  <g transform="translate(22, 22)" filter="url(#winShadow)">
    <rect x="0" y="0" width="448" height="412" rx="6" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.4" />
    <path d="M 0 6 Q 0 0 6 0 L 442 0 Q 448 0 448 6 L 448 30 L 0 30 Z" fill="url(#titleGrad)" />
    <text x="14" y="20" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">通信ポートのプロパティ</text>
    <line x1="424" y1="10" x2="434" y2="20" stroke="#FFFFFF" stroke-width="1.6" />
    <line x1="434" y1="10" x2="424" y2="20" stroke="#FFFFFF" stroke-width="1.6" />

    <!-- タブヘッダ: [コマンド集] アクティブ / [通信ポート] 非アクティブ -->
    <path d="M 12 62 L 12 40 Q 12 36 16 36 L 106 36 Q 110 36 110 40 L 110 62 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <text x="61" y="53" class="ui" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">コマンド集</text>
    <path d="M 112 62 L 112 42 Q 112 38 116 38 L 204 38 Q 208 38 208 42 L 208 62 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    <text x="160" y="53" class="ui" font-size="11.5" fill="#475569" text-anchor="middle">通信ポート</text>

    <!-- タブページ本体 -->
    <rect x="12" y="61" width="424" height="300" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <line x1="13" y1="61" x2="109" y2="61" stroke="#FFFFFF" stroke-width="2" />

    <!-- GroupBox: コマンド集 -->
    <rect x="24" y="76" width="400" height="238" class="grp-box" />
    <rect x="34" y="68" width="76" height="16" fill="#FFFFFF" />
    <text x="38" y="80" class="grp-lbl">コマンド集</text>

    <!-- 上段: コマンド集選択 -->
    <text x="38" y="99" class="ui" font-size="11" font-weight="600" fill="#334155">コマンド集選択（現在有効なマクロスクリプト）</text>
    <rect x="38" y="105" width="372" height="68" class="input-box" />
    <rect x="39" y="106" width="370" height="22" fill="#DBEAFE" />
    <text x="46" y="121" class="mono" font-size="11.5" font-weight="700" fill="#1E3A8A">MODBUS_INVERTER.csv</text>
    <text x="46" y="142" class="mono" font-size="11.5" fill="#0F172A">SERIAL_SENSOR.csv</text>

    <!-- 中央移動ボタン [↑] [↓] -->
    <rect x="168" y="180" width="48" height="24" class="btn-box" />
    <text x="192" y="196" class="ui" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">↑</text>
    <rect x="232" y="180" width="48" height="24" class="btn-box" />
    <text x="256" y="196" class="ui" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">↓</text>

    <!-- 下段: コマンド集リスト -->
    <text x="38" y="220" class="ui" font-size="11" font-weight="600" fill="#334155">コマンド集リスト（登録済み控えリスト）</text>
    <rect x="38" y="226" width="372" height="76" class="input-box" />
    <text x="46" y="244" class="mono" font-size="11.5" fill="#475569">MELSEC_Q_LINK.csv</text>
    <text x="46" y="264" class="mono" font-size="11.5" fill="#475569">TELNET_ROUTER_DIAG.csv</text>

    <!-- コマンド追加 / コマンド削除 -->
    <rect x="74" y="322" width="132" height="28" class="btn-box" />
    <text x="140" y="340" class="ui" font-size="11.5" font-weight="600" fill="#1E293B" text-anchor="middle">コマンド追加</text>
    <rect x="242" y="322" width="132" height="28" class="btn-box" />
    <text x="308" y="340" class="ui" font-size="11.5" font-weight="600" fill="#B91C1C" text-anchor="middle">コマンド削除</text>

    <!-- 下部共通 OK / キャンセル -->
    <rect x="122" y="371" width="96" height="30" class="btn-pri" />
    <text x="170" y="390" class="ui" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">OK</text>
    <rect x="234" y="371" width="96" height="30" class="btn-box" />
    <text x="282" y="390" class="ui" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">キャンセル</text>
  </g>

  <!-- ========================================================= -->
  <!-- 右ウィンドウ: 第2タブ「通信ポート」＋プロトコル連動構成    -->
  <!-- ========================================================= -->
  <g transform="translate(510, 22)" filter="url(#winShadow)">
    <rect x="0" y="0" width="448" height="412" rx="6" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.4" />
    <path d="M 0 6 Q 0 0 6 0 L 442 0 Q 448 0 448 6 L 448 30 L 0 30 Z" fill="url(#titleGrad)" />
    <text x="14" y="20" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">通信ポートのプロパティ</text>
    <line x1="424" y1="10" x2="434" y2="20" stroke="#FFFFFF" stroke-width="1.6" />
    <line x1="434" y1="10" x2="424" y2="20" stroke="#FFFFFF" stroke-width="1.6" />

    <!-- タブヘッダ: [コマンド集] 非アクティブ / [通信ポート] アクティブ -->
    <path d="M 12 62 L 12 42 Q 12 38 16 38 L 106 38 Q 110 38 110 42 L 110 62 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    <text x="61" y="53" class="ui" font-size="11.5" fill="#475569" text-anchor="middle">コマンド集</text>
    <path d="M 112 62 L 112 40 Q 112 36 116 36 L 208 36 Q 212 36 212 40 L 212 62 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <text x="162" y="53" class="ui" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">通信ポート</text>

    <!-- モード連動タブバッジ案内 -->
    <rect x="220" y="38" width="214" height="20" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <text x="327" y="52" class="ui" font-size="10" font-weight="600" fill="#1E40AF" text-anchor="middle">※モードに応じ TELNET / Modbus 等へ切替</text>

    <!-- タブページ本体 -->
    <rect x="12" y="61" width="424" height="300" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <line x1="113" y1="61" x2="211" y2="61" stroke="#FFFFFF" stroke-width="2" />

    <!-- 左列1: ポート -->
    <rect x="24" y="76" width="194" height="58" class="grp-box" />
    <rect x="34" y="68" width="46" height="16" fill="#FFFFFF" />
    <text x="38" y="80" class="grp-lbl">ポート</text>
    <rect x="36" y="92" width="170" height="26" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4" rx="3" />
    <text x="46" y="109" class="mono" font-size="12" font-weight="700" fill="#1E3A8A">COM10  (物理 + c2c)</text>
    <polygon points="192,102 200,102 196,108" fill="#1E40AF" />

    <!-- 左列2: 通信速度 -->
    <rect x="24" y="144" width="194" height="58" class="grp-box" />
    <rect x="34" y="136" width="60" height="16" fill="#FFFFFF" />
    <text x="38" y="148" class="grp-lbl">通信速度</text>
    <rect x="36" y="160" width="170" height="26" class="input-box" />
    <text x="46" y="177" class="mono" font-size="12" fill="#0F172A">9600</text>
    <polygon points="192,170 200,170 196,176" fill="#475569" />

    <!-- 左列3: 接続設定 -->
    <rect x="24" y="212" width="194" height="136" class="grp-box" />
    <rect x="34" y="204" width="60" height="16" fill="#FFFFFF" />
    <text x="38" y="216" class="grp-lbl">接続設定</text>

    <text x="36" y="241" class="ui" font-size="11" fill="#334155">データビット</text>
    <rect x="118" y="226" width="88" height="24" class="input-box" />
    <text x="128" y="242" class="mono" font-size="11.5" fill="#0F172A">8</text>
    <polygon points="192,235 200,235 196,241" fill="#475569" />

    <text x="36" y="279" class="ui" font-size="11" fill="#334155">パリティ</text>
    <rect x="118" y="264" width="88" height="24" class="input-box" />
    <text x="128" y="280" class="mono" font-size="11.5" fill="#0F172A">None</text>
    <polygon points="192,273 200,273 196,279" fill="#475569" />

    <text x="36" y="317" class="ui" font-size="11" fill="#334155">ストップビット</text>
    <rect x="118" y="302" width="88" height="24" class="input-box" />
    <text x="128" y="318" class="mono" font-size="11.5" fill="#0F172A">1</text>
    <polygon points="192,311 200,311 196,317" fill="#475569" />

    <!-- 右列1: 応答待ち時間 -->
    <rect x="230" y="76" width="194" height="82" class="grp-box" />
    <rect x="240" y="68" width="84" height="16" fill="#FFFFFF" />
    <text x="244" y="80" class="grp-lbl">応答待ち時間</text>
    <line x1="244" y1="104" x2="374" y2="104" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <rect x="278" y="95" width="10" height="18" rx="2" fill="#2563EB" />
    <text x="392" y="109" class="mono" font-size="12" font-weight="700" fill="#1E293B">5</text>
    <rect x="244" y="128" width="14" height="14" rx="2" fill="#2563EB" />
    <path d="M 247 135 L 250 138 L 255 131" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
    <text x="264" y="139" class="ui" font-size="11" fill="#1E293B">Auto Adjust</text>

    <!-- 右列2: エコー -->
    <rect x="230" y="168" width="194" height="54" class="grp-box" />
    <rect x="240" y="160" width="46" height="16" fill="#FFFFFF" />
    <text x="244" y="172" class="grp-lbl">エコー</text>
    <circle cx="258" cy="198" r="6.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
    <circle cx="258" cy="198" r="3.2" fill="#2563EB" />
    <text x="270" y="202" class="ui" font-size="11.5" fill="#0F172A">Off</text>
    <circle cx="332" cy="198" r="6.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
    <text x="344" y="202" class="ui" font-size="11.5" fill="#0F172A">On</text>

    <!-- 右列3: フロー制御 -->
    <rect x="230" y="232" width="194" height="116" class="grp-box" />
    <rect x="240" y="224" width="68" height="16" fill="#FFFFFF" />
    <text x="244" y="236" class="grp-lbl">フロー制御</text>
    <circle cx="254" cy="258" r="6.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
    <circle cx="254" cy="258" r="3.2" fill="#2563EB" />
    <text x="266" y="262" class="mono" font-size="11" fill="#0F172A">None</text>

    <circle cx="336" cy="258" r="6.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
    <text x="348" y="262" class="mono" font-size="11" fill="#0F172A">Xon/Xoff</text>

    <circle cx="254" cy="296" r="6.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
    <text x="266" y="300" class="mono" font-size="11" fill="#0F172A">RTS</text>

    <circle cx="336" cy="296" r="6.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
    <text x="348" y="300" class="mono" font-size="11" fill="#0F172A">Xon/RTS</text>

    <!-- 下部共通 OK / キャンセル -->
    <rect x="122" y="371" width="96" height="30" class="btn-pri" />
    <text x="170" y="390" class="ui" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">OK</text>
    <rect x="234" y="371" width="96" height="30" class="btn-box" />
    <text x="282" y="390" class="ui" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">キャンセル</text>
  </g>

  <!-- 下部解説ボックス -->
  <rect x="22" y="446" width="936" height="80" class="callout-box" />
  <text x="40" y="468" class="ui" font-size="11.5" font-weight="700" fill="#92400E">① 「コマンド集」タブ（全モード共通） ＋ ② 「通信ポート」等のモード別通信設定タブ ＋ ③ 「OK / キャンセル」</text>
  <text x="40" y="488" class="ui" font-size="11" fill="#451A03">・左図「コマンド集」では「コマンド追加」で CSV を登録し、「↑」「↓」で有効化するコマンド集（上段）と控えリスト（下段）を切り替えます。</text>
  <text x="40" y="508" class="ui" font-size="11" fill="#451A03">・右図の第2タブ以降は通信モードに連動して［通信ポート］／［TELNET］／［Modbus RTU・Modbus TCP］／［MELSEC］／［MELSEC MC］が表示され、c2c 仮想ポートも自動列挙されます。</text>

  <!-- 番号バッジ -->
  <g>
    <circle cx="42" cy="66" r="11" class="badge-circle" />
    <text x="42" y="66" class="badge-num">1</text>

    <circle cx="628" cy="66" r="11" class="badge-circle" />
    <text x="628" y="66" class="badge-num">2</text>

    <circle cx="136" cy="404" r="11" class="badge-circle" />
    <text x="136" y="404" class="badge-num">3</text>
  </g>
</svg>
