<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="toolGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <radialGradient id="ledGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="55%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </radialGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .tb-btn { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 3; }
      .tb-btn-dis { fill: #F1F5F9; stroke: #E2E8F0; stroke-width: 1; rx: 3; }
      .badge-circle { fill: #E8590C; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; font-size: 12.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .callout-box { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.3; rx: 6; }
      .callout-title { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 12px; font-weight: 700; fill: #92400E; }
      .callout-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; fill: #451A03; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="940" height="560" fill="#F8FAFC" rx="10" />

  <!-- メインウィンドウ本体 (左配置: 560x496) -->
  <g transform="translate(24, 26)" filter="url(#winShadow)">
    <rect x="0" y="0" width="560" height="496" rx="7" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.5" />
    <!-- タイトルバー -->
    <path d="M 0 7 Q 0 0 7 0 L 553 0 Q 560 0 560 7 L 560 32 L 0 32 Z" fill="url(#titleGrad)" />
    <rect x="12" y="8" width="16" height="16" rx="3" fill="#38BDF8" />
    <text x="20" y="20" class="mono" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">&gt;_</text>
    <text x="36" y="21" class="ui" font-size="13" font-weight="700" fill="#FFFFFF">Monaca Term</text>
    <text x="132" y="21" class="ui" font-size="11" fill="#BFDBFE">(タスク P2 以降は Monaca Term-2 ～ Term-10)</text>

    <!-- ウィンドウ制御ボタン -->
    <g stroke="#E2E8F0" stroke-width="1.4" fill="none">
      <line x1="478" y1="17" x2="489" y2="17" />
      <rect x="506" y="11" width="10" height="10" />
      <line x1="534" y1="11" x2="544" y2="21" />
      <line x1="544" y1="11" x2="534" y2="21" />
    </g>

    <!-- ① メニューバー (mnuTopMenu 全7項目) -->
    <rect x="1" y="32" width="558" height="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="12" y="49" class="ui" font-size="11.5" fill="#1E293B">ファイル(F)</text>
    <text x="78" y="49" class="ui" font-size="11.5" fill="#1E293B">通信ポート(C)</text>
    <rect x="156" y="34" width="82" height="22" rx="3" fill="#DBEAFE" />
    <text x="162" y="49" class="ui" font-size="11.5" font-weight="700" fill="#1D4ED8">通信モード(M)</text>
    <text x="246" y="49" class="ui" font-size="11.5" fill="#1E293B">フォント(T)</text>
    <text x="310" y="49" class="ui" font-size="11.5" fill="#1E293B">設定(S)</text>
    <text x="360" y="49" class="ui" font-size="11.5" fill="#1E293B">時刻表示</text>
    <text x="420" y="49" class="ui" font-size="11.5" fill="#1E293B">ヘルプ(H)</text>

    <!-- ② アイコンツールバー (termToolBar: 左13要素 + 右端LEDランプ) -->
    <rect x="1" y="58" width="558" height="36" fill="url(#toolGrad)" stroke="#CBD5E1" stroke-width="1" />
    <g transform="translate(8, 63)">
      <!-- 1. 終了 -->
      <rect x="0" y="0" width="26" height="26" class="tb-btn" />
      <rect x="6" y="5" width="11" height="16" fill="none" stroke="#475569" stroke-width="1.5" />
      <path d="M 13 13 L 21 13 M 18 10 L 21 13 L 18 16" stroke="#DC2626" stroke-width="1.5" fill="none" />
      <line x1="31" y1="3" x2="31" y2="23" stroke="#CBD5E1" stroke-width="1.2" />

      <!-- 2. ログ開く / 3. ログ閉じる -->
      <rect x="36" y="0" width="26" height="26" class="tb-btn" />
      <path d="M 42 8 L 48 8 L 50 10 L 56 10 L 56 20 L 42 20 Z" fill="#FDE68A" stroke="#D97706" stroke-width="1.3" />
      <rect x="65" y="0" width="26" height="26" class="tb-btn-dis" />
      <path d="M 71 9 L 85 9 L 85 20 L 71 20 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2" />
      <line x1="96" y1="3" x2="96" y2="23" stroke="#CBD5E1" stroke-width="1.2" />

      <!-- 4. ポート開く / 5. ポート閉じる -->
      <rect x="101" y="0" width="26" height="26" class="tb-btn-dis" />
      <circle cx="114" cy="13" r="6" fill="none" stroke="#94A3B8" stroke-width="1.6" />
      <rect x="130" y="0" width="26" height="26" class="tb-btn" />
      <path d="M 137 13 L 149 13 M 140 8 L 146 18" stroke="#DC2626" stroke-width="1.8" />
      <line x1="161" y1="3" x2="161" y2="23" stroke="#CBD5E1" stroke-width="1.2" />

      <!-- 6. プロパティ + 7. クイック設定▼ -->
      <rect x="166" y="0" width="26" height="26" class="tb-btn" />
      <circle cx="179" cy="13" r="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6" />
      <rect x="194" y="0" width="16" height="26" class="tb-btn" />
      <polygon points="199,11 205,11 202,16" fill="#334155" />
      <line x1="215" y1="3" x2="215" y2="23" stroke="#CBD5E1" stroke-width="1.2" />

      <!-- 8. テキスト送信 + 9. 履歴▼ -->
      <rect x="220" y="0" width="26" height="26" class="tb-btn" />
      <rect x="226" y="5" width="13" height="16" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.4" />
      <path d="M 230 13 L 237 13" stroke="#0284C7" stroke-width="1.4" />
      <rect x="248" y="0" width="16" height="26" class="tb-btn" />
      <polygon points="253,11 259,11 256,16" fill="#334155" />
      <line x1="269" y1="3" x2="269" y2="23" stroke="#CBD5E1" stroke-width="1.2" />

      <!-- 10. コマンドパラメータ設定(エディタ起動) / 11. 実行▶ / 12. ▼ / 13. 停止■ -->
      <rect x="274" y="0" width="26" height="26" class="tb-btn" />
      <path d="M 281 18 L 291 8 L 294 11 L 284 21 Z" fill="#2563EB" />
      <rect x="303" y="0" width="26" height="26" class="tb-btn" />
      <polygon points="312,7 322,13 312,19" fill="#16A34A" />
      <rect x="331" y="0" width="16" height="26" class="tb-btn" />
      <polygon points="336,11 342,11 339,16" fill="#334155" />
      <rect x="350" y="0" width="26" height="26" class="tb-btn" />
      <rect x="358" y="8" width="10" height="10" fill="#DC2626" />

      <!-- 14. 右端 LED 通信状態ランプ -->
      <circle cx="530" cy="13" r="9.5" fill="url(#ledGreen)" stroke="#14532D" stroke-width="1.2" />
    </g>

    <!-- ④ 中央ターミナル送受信テキスト領域 (txtTerm) -->
    <rect x="8" y="102" width="544" height="356" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <!-- 垂直スクロールバー -->
    <rect x="534" y="103" width="17" height="337" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <rect x="536" y="128" width="13" height="76" rx="3" fill="#CBD5E1" />
    <!-- 水平スクロールバー -->
    <rect x="9" y="440" width="525" height="17" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />

    <!-- 送受信テキスト例 (青文字基調 + タイムスタンプ有効例) -->
    <g class="mono" font-size="12" fill="#1D4ED8">
      <text x="18" y="126">[ 2026/11/12 12:00:01.050 ] &gt; *IDN?</text>
      <text x="18" y="148">[ 2026/11/12 12:00:01.092 ] MONACA-CONTROLLER,VER2.4,SN00182</text>
      <text x="18" y="170">[ 2026/11/12 12:00:01.510 ] &gt; MEAS:TEMP? CH1</text>
      <text x="18" y="192">[ 2026/11/12 12:00:01.548 ] +24.85 C</text>
      <text x="18" y="214">[ 2026/11/12 12:00:02.100 ] &gt; STAT:ALM?</text>
      <text x="18" y="236">[ 2026/11/12 12:00:02.134 ] 0000 (NORMAL)</text>
      <text x="18" y="264" fill="#64748B">; 直接キー入力による対話送信 ＆ テキストファイル D&amp;D 送信に対応</text>
      <text x="18" y="284" fill="#64748B">; 受信ストリームは IWorkBufferHost 経由で Set_Data / Get_Line と直結</text>
      <rect x="18" y="300" width="8" height="15" fill="#2563EB" opacity="0.75" />
    </g>

    <!-- ⑤ 下部ステータスバー (stsUnderLine 3枠) -->
    <rect x="1" y="466" width="558" height="29" rx="3" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="1" />
    <line x1="150" y1="469" x2="150" y2="492" stroke="#CBD5E1" stroke-width="1.2" />
    <line x1="462" y1="469" x2="462" y2="492" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="12" y="485" class="ui" font-size="11.5" font-weight="600" fill="#15803D">ステータス: 接続中</text>
    <text x="162" y="485" class="mono" font-size="11.5" fill="#1E293B">設定: COM10:9600,N,8,1</text>
    <text x="510" y="485" class="mono" font-size="11.5" fill="#334155" text-anchor="middle">00:03:42</text>
  </g>

  <!-- 右側コールアウト群 -->
  <!-- コールアウト A: 通信モード(M) ドロップダウン内訳 -->
  <g transform="translate(608, 30)" filter="url(#winShadow)">
    <rect x="0" y="0" width="308" height="154" rx="6" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.4" />
    <rect x="0" y="0" width="308" height="28" rx="6" fill="#EFF6FF" />
    <text x="14" y="19" class="ui" font-size="12" font-weight="700" fill="#1E3A8A">① メニュー「通信モード(M)」切替一覧</text>
    <text x="18" y="48" class="mono" font-size="12" font-weight="700" fill="#1D4ED8">✓ RS-232C    (COM シリアル / c2c)</text>
    <text x="18" y="70" class="mono" font-size="12" fill="#334155">  TELNET     (TCP/IP ソケット)</text>
    <text x="18" y="92" class="mono" font-size="12" fill="#334155">  MODBUS     (RTU / ASCII / TCP)</text>
    <text x="18" y="114" class="mono" font-size="12" fill="#334155">  MELSEC     (計算機リンク 形式1～5)</text>
    <text x="18" y="136" class="mono" font-size="12" fill="#334155">  MELSEC MC  (3Eフレーム TCP/UDP)</text>
  </g>
  <path d="M 238 74 L 606 74" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- コールアウト B: 各部説明 -->
  <rect x="608" y="200" width="308" height="322" class="callout-box" />
  <text x="622" y="224" class="callout-title">② ツールバー（左 ➔ 右）</text>
  <text x="622" y="243" class="callout-txt">・終了 ｜ ログ開く・閉じる ｜ ポート開く・閉じる</text>
  <text x="622" y="260" class="callout-txt">・プロパティ・速度設定▼ ｜ テキスト送信・履歴▼</text>
  <text x="622" y="277" class="callout-txt">・コマンド編集・コマンド実行▶▼・停止■</text>

  <text x="622" y="303" class="callout-title">③ 通信状態 LED ランプ（右端）</text>
  <text x="622" y="322" class="callout-txt">・未接続時は赤色、ポート接続中は緑色に点灯します。</text>

  <text x="622" y="348" class="callout-title">④ 送受信ターミナル画面（txtTerm）</text>
  <text x="622" y="367" class="callout-txt">・送受信データのリアルタイム表示・直接キー送信。</text>
  <text x="622" y="384" class="callout-txt">・「時刻表示 ➔ 時刻有効」でミリ秒時刻を先頭付加。</text>
  <text x="622" y="401" class="callout-txt">・受信データは共通ワークバッファへ自動格納。</text>

  <text x="622" y="427" class="callout-title">⑤ 下部ステータスバー（3ペイン）</text>
  <text x="622" y="446" class="callout-txt">・左：現在の通信ステータス（接続中／切断中 等）</text>
  <text x="622" y="463" class="callout-txt">・中：現在の接続先条件（COMポート・速度・IP等）</text>
  <text x="622" y="480" class="callout-txt">・右：ポート接続後の経過時間タイマー（HH:mm:ss）</text>
  <text x="622" y="504" class="callout-txt">※メニュー「設定(S)」から言語切替・監査ログ確認可</text>

  <!-- 番号バッジ -->
  <g>
    <circle cx="24" cy="70" r="11" class="badge-circle" />
    <text x="24" y="70" class="badge-num">1</text>

    <circle cx="24" cy="102" r="11" class="badge-circle" />
    <text x="24" y="102" class="badge-num">2</text>

    <circle cx="562" cy="102" r="11" class="badge-circle" />
    <text x="562" y="102" class="badge-num">3</text>

    <circle cx="48" cy="240" r="11" class="badge-circle" />
    <text x="48" y="240" class="badge-num">4</text>

    <circle cx="24" cy="505" r="11" class="badge-circle" />
    <text x="24" y="505" class="badge-num">5</text>
  </g>
</svg>
