<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <defs>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.14" />
    </filter>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .card { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.4; rx: 7; }
      .seq-hdr { fill: #DCE6F2; stroke: #64748B; stroke-width: 1; }
      .seq-val { fill: #FFFFFF; stroke: #64748B; stroke-width: 1; }
      .badge-circle { fill: #E8590C; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="980" height="520" fill="#F8FAFC" rx="10" />
  <text x="490" y="30" class="ui" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Term マクロスクリプト（CSV） ⇔ コマンド編集画面・Excel シーケンス 連動マッピング</text>

  <!-- ========================================================= -->
  <!-- 左ペイン: CSV マクロスクリプト定義 (Shift-JIS)            -->
  <!-- ========================================================= -->
  <g transform="translate(20, 48)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="432" height="390" class="card" />
    <path d="M 0 7 Q 0 0 7 0 L 425 0 Q 432 0 432 7 L 432 32 L 0 32 Z" fill="#1E293B" />
    <text x="14" y="21" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">① Term マクロスクリプト CSV（Shift-JIS）</text>

    <!-- TITLE -->
    <rect x="12" y="44" width="408" height="30" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="20" y="63" class="mono" font-size="11.5" fill="#334155">TITLE, "MODBUS_INVERTER"</text>

    <!-- COMMAND -->
    <rect x="12" y="84" width="408" height="34" rx="4" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.3" />
    <text x="20" y="105" class="mono" font-size="11.5" font-weight="700" fill="#1E3A8A">COMMAND, "REG_READ", "RES_DATA"</text>

    <!-- PARAM List -->
    <rect x="12" y="128" width="408" height="42" rx="4" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.3" />
    <text x="20" y="146" class="mono" font-size="11" font-weight="700" fill="#14532D">,PARAM, "FUNC", List, "ファンクション", "03:保持", "04:入力"</text>
    <text x="28" y="163" class="ui" font-size="10" fill="#15803D">▲ 第4列=List ➔ UIコンボ＆Excel入力規則リスト［▼］を生成</text>

    <!-- PARAM Value -->
    <rect x="12" y="178" width="408" height="36" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" />
    <text x="20" y="200" class="mono" font-size="11" font-weight="700" fill="#14532D">,PARAM, "ADDR", Value, "先頭アドレス", "40001"</text>

    <!-- PARAM Range (Result格納先) -->
    <rect x="12" y="222" width="408" height="40" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1.3" />
    <text x="20" y="241" class="mono" font-size="11" font-weight="700" fill="#065F46">,PARAM, "RES_DATA", Range, "読出データ結果", ""</text>
    <text x="28" y="256" class="ui" font-size="10" fill="#047857">▲ COMMAND第3引数と一致 ➔ Result出力先・2次元セル展開</text>

    <!-- PARAM Work (内部作業変数) -->
    <rect x="12" y="270" width="408" height="42" rx="4" fill="#FEF2F2" stroke="#F87171" stroke-width="1.3" />
    <text x="20" y="289" class="mono" font-size="11" font-weight="700" fill="#991B1B">,PARAM, "TMP_BUF", Work, "内部バッファ", ""</text>
    <text x="28" y="305" class="ui" font-size="10" font-weight="700" fill="#B91C1C">▲ Work型：コマンド編集画面のみ表示 ／ Excelシート列は自動除外</text>

    <!-- SEQUENCE -->
    <rect x="12" y="320" width="408" height="58" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" />
    <text x="20" y="340" class="mono" font-size="11" fill="#78350F">,SEQUENCE, 10, Modbus_Read, "$FUNC$", "$ADDR$", "2"</text>
    <text x="20" y="360" class="mono" font-size="11" fill="#78350F">,SEQUENCE, 20, Set_Data, "RES_DATA"</text>
  </g>

  <!-- ========================================================= -->
  <!-- 右上ペイン: コマンド編集画面へのマッピング                -->
  <!-- ========================================================= -->
  <g transform="translate(508, 48)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="452" height="196" class="card" />
    <path d="M 0 7 Q 0 0 7 0 L 445 0 Q 452 0 452 7 L 452 30 L 0 30 Z" fill="#1E3A8A" />
    <text x="14" y="20" class="ui" font-size="12" font-weight="700" fill="#FFFFFF">② コマンド編集画面（TermEditForm）での表示</text>

    <!-- コマンドコンボ -->
    <text x="16" y="52" class="ui" font-size="11" font-weight="600" fill="#334155">選択コマンド:</text>
    <rect x="96" y="37" width="160" height="22" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" />
    <text x="104" y="52" class="mono" font-size="11.5" font-weight="700" fill="#1E3A8A">REG_READ ▼</text>

    <!-- パラメータ枠ミニチュア -->
    <rect x="16" y="66" width="420" height="84" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <rect x="24" y="73" width="128" height="18" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
    <text x="30" y="86" class="ui" font-size="10.5" fill="#0F172A">ファンクション</text>
    <rect x="158" y="73" width="266" height="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
    <text x="164" y="86" class="mono" font-size="10.5" fill="#0F172A">03:保持 ▼  (候補: 03:保持 / 04:入力)</text>

    <rect x="24" y="96" width="128" height="18" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
    <text x="30" y="109" class="ui" font-size="10.5" fill="#0F172A">先頭アドレス</text>
    <rect x="158" y="96" width="266" height="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
    <text x="164" y="109" class="mono" font-size="10.5" fill="#0F172A">40001</text>

    <rect x="24" y="119" width="128" height="18" fill="#FEE2E2" stroke="#F87171" stroke-width="1" />
    <text x="30" y="132" class="ui" font-size="10.5" font-weight="700" fill="#991B1B">内部バッファ (Work)</text>
    <rect x="158" y="119" width="266" height="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
    <text x="164" y="132" class="ui" font-size="10" fill="#991B1B">※デバッグ確認用に編集画面では表示される</text>

    <!-- 下部結果枠 -->
    <rect x="16" y="156" width="150" height="28" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2" />
    <text x="22" y="174" class="ui" font-size="10.5" font-weight="700" fill="#065F46">読出データ結果</text>
    <rect x="170" y="156" width="266" height="28" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2" />
    <text x="180" y="174" class="mono" font-size="11.5" font-weight="700" fill="#047857">2485, 1500</text>
  </g>

  <!-- ========================================================= -->
  <!-- 右下ペイン: Excel 2行シーケンスへのマッピング             -->
  <!-- ========================================================= -->
  <g transform="translate(508, 262)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="452" height="176" class="card" />
    <path d="M 0 7 Q 0 0 7 0 L 445 0 Q 452 0 452 7 L 452 30 L 0 30 Z" fill="#185C37" />
    <text x="14" y="20" class="ui" font-size="12" font-weight="700" fill="#FFFFFF">③ Excel ワークシート（2行1ステップ配置）での表示</text>

    <!-- 2行シーケンステーブル -->
    <g transform="translate(14, 46)">
      <!-- 実行 -->
      <rect x="0" y="0" width="52" height="52" fill="#F0F0F0" stroke="#64748B" stroke-width="1" />
      <rect x="4" y="6" width="44" height="40" rx="3" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2" />
      <text x="26" y="30" class="ui" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">実行</text>

      <!-- Wait -->
      <rect x="52" y="0" width="54" height="25" class="seq-hdr" />
      <text x="79" y="16" class="ui" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Wait(ms)</text>
      <rect x="52" y="25" width="54" height="27" class="seq-val" />
      <text x="98" y="43" class="mono" font-size="11" fill="#0F172A" text-anchor="end">0</text>

      <!-- Command -->
      <rect x="106" y="0" width="92" height="25" class="seq-hdr" />
      <text x="152" y="16" class="ui" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Command</text>
      <rect x="106" y="25" width="92" height="27" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" />
      <text x="111" y="43" class="mono" font-size="10.5" font-weight="700" fill="#1E3A8A">P1:REG_READ</text>

      <!-- Result -->
      <rect x="198" y="0" width="76" height="25" class="seq-hdr" />
      <text x="236" y="16" class="ui" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Result</text>
      <rect x="198" y="25" width="76" height="27" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2" />
      <text x="204" y="43" class="mono" font-size="10.5" font-weight="700" fill="#065F46">D8 / 名前</text>

      <!-- 引数1 -->
      <rect x="274" y="0" width="80" height="25" class="seq-hdr" />
      <text x="314" y="16" class="ui" font-size="9.5" font-weight="700" fill="#0F172A" text-anchor="middle">ファンクション</text>
      <rect x="274" y="25" width="80" height="27" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.2" />
      <text x="279" y="43" class="mono" font-size="10.5" fill="#14532D">03:保持 ▼</text>

      <!-- 引数2 -->
      <rect x="354" y="0" width="70" height="25" class="seq-hdr" />
      <text x="389" y="16" class="ui" font-size="9.5" font-weight="700" fill="#0F172A" text-anchor="middle">先頭アドレス</text>
      <rect x="354" y="25" width="70" height="27" class="seq-val" />
      <text x="418" y="43" class="mono" font-size="10.5" fill="#0F172A" text-anchor="end">40001</text>
    </g>

    <!-- Work除外注記 -->
    <rect x="14" y="110" width="424" height="52" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2" />
    <text x="24" y="130" class="ui" font-size="11" font-weight="700" fill="#991B1B">🚫 Work 型（内部バッファ）は Excel シート上に列生成されません</text>
    <text x="24" y="149" class="ui" font-size="10.5" fill="#7F1D1D">公開パラメータのみが第5列以降へ整然と並び、シート実行時に $FUNC$, $ADDR$ へ動的置換されます。</text>
  </g>

  <!-- マッピング接続矢印 -->
  <g fill="none" stroke-width="2">
    <!-- COMMAND -> 右上 & 右下 -->
    <path d="M 440 149 L 476 149 L 476 96 L 504 96" stroke="#2563EB" />
    <polygon points="500,91 508,96 500,101" fill="#2563EB" />
    <path d="M 476 149 L 476 340 L 504 340" stroke="#2563EB" stroke-dasharray="4 3" />
    <polygon points="500,335 508,340 500,345" fill="#2563EB" />

    <!-- PARAM List -> 右上 & 右下 -->
    <path d="M 440 197 L 490 197 L 490 130 L 504 130" stroke="#16A34A" />
    <polygon points="500,125 508,130 500,135" fill="#16A34A" />
    <path d="M 490 197 L 490 315 L 504 315" stroke="#16A34A" />
    <polygon points="500,310 508,315 500,320" fill="#16A34A" />
  </g>

  <!-- 下部ポイント要約 -->
  <rect x="20" y="452" width="940" height="54" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.3" />
  <text x="36" y="474" class="ui" font-size="11.5" font-weight="700" fill="#92400E">💡 移植性と安全設計のポイント</text>
  <text x="36" y="494" class="ui" font-size="11" fill="#451A03">・COM ポート番号や IP アドレスは「プロパティ設定画面」側で管理されるため、CSV スクリプトを一切書き換えずに物理ポートと c2c 仮想ポートを切り替えられます。</text>
</svg>
