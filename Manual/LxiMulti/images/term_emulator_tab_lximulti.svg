<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510">
  <defs>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.14" />
    </filter>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B; }
      .sub { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 10.5px; fill: #475569; }
      .grp { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.1; rx: 5; }
      .grp-hdr { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E3A8A; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="510" fill="#F8FAFC" rx="10" />
  <text x="24" y="25" class="ui" font-size="13.5" font-weight="700" fill="#0F172A">[LXI Multi] TermEmulator マルチ LXI 仮想計測器プリセット構成画面</text>

  <rect x="616" y="9" width="240" height="22" rx="11" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1" />
  <text x="736" y="24" class="ui" font-size="10.2" font-weight="700" fill="#1D4ED8" text-anchor="middle">✓ マルチチャネル同時起動プリセット</text>

  <g filter="url(#cardShadow)">
    <rect x="24" y="44" width="832" height="442" rx="6" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5" />
  </g>

  <rect x="38" y="58" width="804" height="40" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
  <text x="54" y="83" class="ui" font-size="11.5" font-weight="700" fill="#1E3A8A">マルチ LXI プリセット（電源 ＋ DMM ＋ オシロスコープ 3 台同時待受・並列測定検証用）</text>
  <rect x="656" y="64" width="174" height="28" rx="4" fill="#1D4ED8" />
  <text x="743" y="82" class="ui" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">▶ 全チャネル一括起動</text>

  <!-- 3 チャネル並列稼働ダッシュボード -->
  <rect x="38" y="110" width="804" height="196" class="grp" />
  <text x="52" y="131" class="grp-hdr">① TermEmulator 複数チャネル同時稼働状態（127.0.0.1 ローカル並列テスト）</text>

  <!-- テーブルヘッダ -->
  <rect x="52" y="144" width="776" height="26" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
  <text x="64" y="161" class="ui" font-size="10.8" font-weight="700" fill="#1E293B">CH</text>
  <text x="112" y="161" class="ui" font-size="10.8" font-weight="700" fill="#1E293B">エイリアス / 役割</text>
  <text x="276" y="161" class="ui" font-size="10.8" font-weight="700" fill="#1E293B">プロトコル</text>
  <text x="388" y="161" class="ui" font-size="10.8" font-weight="700" fill="#1E293B">待受エンドポイント</text>
  <text x="564" y="161" class="ui" font-size="10.8" font-weight="700" fill="#1E293B">模擬応答例</text>
  <text x="752" y="161" class="ui" font-size="10.8" font-weight="700" fill="#1E293B">状態</text>

  <!-- E0 -->
  <rect x="52" y="170" width="776" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
  <text x="64" y="193" class="mono" font-size="11" font-weight="700" fill="#1E3A8A">E0</text>
  <text x="112" y="193" class="ui" font-size="11" font-weight="700" fill="#0F172A">PSU1（直流安定化電源）</text>
  <text x="276" y="193" class="mono" font-size="10.8" fill="#1D4ED8">LXI Raw</text>
  <text x="388" y="193" class="mono" font-size="10.8" fill="#0F172A">127.0.0.1:5025</text>
  <text x="564" y="193" class="mono" font-size="10.5" fill="#334155">MEAS:CURR? -&gt; +1.250</text>
  <text x="752" y="193" class="mono" font-size="10.5" font-weight="700" fill="#15803D">● 待受中</text>

  <!-- E1 -->
  <rect x="52" y="206" width="776" height="36" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" />
  <text x="64" y="229" class="mono" font-size="11" font-weight="700" fill="#1E3A8A">E1</text>
  <text x="112" y="229" class="ui" font-size="11" font-weight="700" fill="#0F172A">DMM1（デジタルマルチメータ）</text>
  <text x="276" y="229" class="mono" font-size="10.8" fill="#1D4ED8">LXI Raw</text>
  <text x="388" y="229" class="mono" font-size="10.8" fill="#0F172A">127.0.0.1:5026</text>
  <text x="564" y="229" class="mono" font-size="10.5" fill="#334155">MEAS:VOLT? -&gt; +5.004</text>
  <text x="752" y="229" class="mono" font-size="10.5" font-weight="700" fill="#15803D">● 待受中</text>

  <!-- E2 -->
  <rect x="52" y="242" width="776" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
  <text x="64" y="265" class="mono" font-size="11" font-weight="700" fill="#1E3A8A">E2</text>
  <text x="112" y="265" class="ui" font-size="11" font-weight="700" fill="#0F172A">OSC1（オシロスコープ）</text>
  <text x="276" y="265" class="mono" font-size="10.8" fill="#1D4ED8">LXI HiSLIP</text>
  <text x="388" y="265" class="mono" font-size="10.8" fill="#0F172A">127.0.0.1:4880</text>
  <text x="564" y="265" class="mono" font-size="10.5" fill="#334155">MEAS:FREQ? -&gt; 1.000E+6</text>
  <text x="752" y="265" class="mono" font-size="10.5" font-weight="700" fill="#15803D">● 待受中</text>

  <!-- ② 並列クエリ・一斉トリガ動作確認イメージ -->
  <rect x="38" y="318" width="804" height="154" rx="5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" />
  <text x="52" y="340" class="ui" font-size="11.5" font-weight="700" fill="#92400E">② LxiMulti 並列シーケンス動作フロー（Excel 1 ステップで同時並列回収）</text>

  <text x="52" y="368" class="mono" font-size="11" fill="#0F172A">1) LxiMulti_OpenAll                          -&gt; E0(5025) / E1(5026) / E2(4880) を一括並列接続</text>
  <text x="52" y="392" class="mono" font-size="11" fill="#0F172A">2) LxiMulti_Broadcast "TRIG_GRP", "*TRG"     -&gt; DMM1 / OSC1 へ同時一斉トリガ送出</text>
  <text x="52" y="416" class="mono" font-size="11" fill="#1D4ED8">3) LxiMulti_ParallelQuery "PSU1,DMM1,OSC1"   -&gt; Task.WhenAll で全応答を同時回収し Excel 範囲へ展開</text>
  <text x="52" y="446" class="sub">※ 各チャネルの「異常注入」タブで特定 1 台だけタイムアウト／遅延させたときのエラー回収テストも可能です。</text>
  <text x="52" y="463" class="mono" font-size="10" fill="#64748B">実装配置: Apr/Term/ExtAnalysis/TermAnalysis.LxiMulti/ (TermEmulator マルチ LXI プリセット連携)</text>
</svg>
