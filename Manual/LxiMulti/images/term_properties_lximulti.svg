<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="530" viewBox="0 0 660 530">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .grp-box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.2; rx: 4; }
      .grp-lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .input-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 3; }
      .btn-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 4; }
      .btn-pri { fill: #2563EB; stroke: #1D4ED8; stroke-width: 1; rx: 4; }
      .callout-box { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.3; rx: 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="660" height="530" fill="#F8FAFC" rx="10" />

  <g transform="translate(26, 20)" filter="url(#winShadow)">
    <rect x="0" y="0" width="608" height="438" rx="6" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.4" />
    <path d="M 0 6 Q 0 0 6 0 L 602 0 Q 608 0 608 6 L 608 30 L 0 30 Z" fill="url(#titleGrad)" />
    <text x="14" y="20" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">通信ポートのプロパティ — [LXI Multi] タブ</text>

    <path d="M 14 62 L 14 42 Q 14 38 18 38 L 108 38 Q 112 38 112 42 L 112 62 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    <text x="63" y="53" class="ui" font-size="11.5" fill="#475569" text-anchor="middle">コマンド集</text>
    <path d="M 114 62 L 114 40 Q 114 36 118 36 L 236 36 Q 240 36 240 40 L 240 62 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <text x="177" y="53" class="ui" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">LXI Multi</text>

    <rect x="14" y="61" width="580" height="328" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <line x1="115" y1="61" x2="239" y2="61" stroke="#FFFFFF" stroke-width="2" />

    <!-- GroupBox 1: 登録 LXI 計測器エイリアス一覧 -->
    <rect x="28" y="76" width="552" height="206" class="grp-box" />
    <rect x="38" y="68" width="290" height="16" fill="#FFFFFF" />
    <text x="42" y="80" class="grp-lbl">登録 LXI 計測器エイリアス一覧（プロトコル混在可）</text>

    <!-- 上部操作ボタン -->
    <rect x="42" y="90" width="96" height="24" class="btn-pri" />
    <text x="90" y="106" class="ui" font-size="10.2" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ 機器追加</text>
    <rect x="144" y="90" width="76" height="24" class="btn-box" />
    <text x="182" y="106" class="ui" font-size="10.2" fill="#1E293B" text-anchor="middle">削除</text>
    <rect x="226" y="90" width="122" height="24" class="btn-box" />
    <text x="287" y="106" class="ui" font-size="10.2" font-weight="600" fill="#1D4ED8" text-anchor="middle">mDNS 一括追加</text>
    <rect x="444" y="90" width="122" height="24" class="btn-box" />
    <text x="505" y="106" class="ui" font-size="10.2" font-weight="600" fill="#15803D" text-anchor="middle">全機器 疎通テスト</text>

    <!-- テーブルヘッダ -->
    <rect x="42" y="122" width="524" height="24" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    <text x="52" y="138" class="ui" font-size="10.5" font-weight="700" fill="#1E293B">エイリアス</text>
    <text x="128" y="138" class="ui" font-size="10.5" font-weight="700" fill="#1E293B">方式</text>
    <text x="206" y="138" class="ui" font-size="10.5" font-weight="700" fill="#1E293B">接続先 IP : ポート / サブ</text>
    <text x="386" y="138" class="ui" font-size="10.5" font-weight="700" fill="#1E293B">グループ</text>
    <text x="476" y="138" class="ui" font-size="10.5" font-weight="700" fill="#1E293B">状態</text>

    <!-- 行 1 -->
    <rect x="42" y="146" width="524" height="28" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="52" y="164" class="mono" font-size="11" font-weight="700" fill="#1E3A8A">PSU1</text>
    <text x="128" y="164" class="mono" font-size="10.5" fill="#0F172A">LxiRaw</text>
    <text x="206" y="164" class="mono" font-size="10.5" fill="#0F172A">192.168.1.51:5025</text>
    <text x="386" y="164" class="mono" font-size="10.5" fill="#334155">LINE_A</text>
    <text x="476" y="164" class="mono" font-size="10.5" fill="#15803D">✓ OK</text>

    <!-- 行 2 -->
    <rect x="42" y="174" width="524" height="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="52" y="192" class="mono" font-size="11" font-weight="700" fill="#1E3A8A">DMM1</text>
    <text x="128" y="192" class="mono" font-size="10.5" fill="#0F172A">LxiVxi11</text>
    <text x="206" y="192" class="mono" font-size="10.5" fill="#0F172A">192.168.1.52 / inst0</text>
    <text x="386" y="192" class="mono" font-size="10.5" fill="#334155">TRIG_GRP</text>
    <text x="476" y="192" class="mono" font-size="10.5" fill="#15803D">✓ OK</text>

    <!-- 行 3 -->
    <rect x="42" y="202" width="524" height="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="52" y="220" class="mono" font-size="11" font-weight="700" fill="#1E3A8A">OSC1</text>
    <text x="128" y="220" class="mono" font-size="10.5" fill="#0F172A">LxiHiSlip</text>
    <text x="206" y="220" class="mono" font-size="10.5" fill="#0F172A">192.168.1.53:4880/hislip0</text>
    <text x="386" y="220" class="mono" font-size="10.5" fill="#334155">TRIG_GRP</text>
    <text x="476" y="220" class="mono" font-size="10.5" fill="#15803D">✓ OK</text>

    <!-- 行 4 (空き行イメージ) -->
    <rect x="42" y="230" width="524" height="40" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="52" y="254" class="ui" font-size="10.2" fill="#64748B">※ 10 タスク (P1〜P10) の上限なく、必要な台数分をエイリアス登録して並列制御できます。</text>

    <!-- GroupBox 2: 並列実行オプション -->
    <rect x="28" y="292" width="552" height="86" class="grp-box" />
    <rect x="38" y="284" width="234" height="16" fill="#FFFFFF" />
    <text x="42" y="296" class="grp-lbl">並列クエリ・一斉送信実行設定</text>

    <text x="42" y="324" class="ui" font-size="11" fill="#334155">並列タイムアウト(ms):</text>
    <rect x="166" y="308" width="90" height="24" class="input-box" />
    <text x="176" y="324" class="mono" font-size="11.5" fill="#0F172A">5000</text>
    <text x="274" y="324" class="ui" font-size="11" fill="#334155">一部エラー時動作:</text>
    <rect x="378" y="308" width="188" height="24" class="input-box" />
    <text x="388" y="324" class="ui" font-size="10.5" fill="#0F172A">他機器結果を回収しエラー記録 ▼</text>

    <rect x="42" y="346" width="14" height="14" rx="2" fill="#2563EB" />
    <path d="M 45 353 L 48 356 L 53 349" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
    <text x="64" y="357" class="ui" font-size="10.8" fill="#1E293B">Task.WhenAll により全登録機器へ同時並列クエリを発行し、結果を Excel 範囲へ一括展開する</text>

    <rect x="200" y="398" width="96" height="30" class="btn-pri" />
    <text x="248" y="417" class="ui" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">OK</text>
    <rect x="312" y="398" width="96" height="30" class="btn-box" />
    <text x="360" y="417" class="ui" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">キャンセル</text>
  </g>

  <rect x="26" y="470" width="608" height="44" class="callout-box" />
  <text x="42" y="489" class="ui" font-size="11" font-weight="700" fill="#92400E">メイン画面の［通信モード(M)］で「LXI_MULTI」選択時に自動表示</text>
  <text x="42" y="506" class="ui" font-size="10.5" fill="#451A03">・導入済みの LxiRaw / LxiVxi11 / LxiHiSlip を 1 タスク内で束ね、一斉トリガと同時並列測定を実現します。</text>
</svg>
