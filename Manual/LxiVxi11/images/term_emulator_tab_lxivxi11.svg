  <rect x="0" y="0" width="880" height="510" fill="#F8FAFC" rx="10" />
  <text x="24" y="25" class="ui" font-size="13.5" font-weight="700" fill="#0F172A">[LXI VXI-11] ONC RPC 仮想計測器タブ画面（TermAnalysis.LxiVxi11.dll 内蔵）</text>

