  <line x1="375" y1="66" x2="495" y2="66" stroke="#F8FAFC" stroke-width="2.5" />

  <rect x="38" y="80" width="804" height="38" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
  <text x="54" y="104" class="ui" font-size="11.5" font-weight="700" fill="#1E3A8A">VXI-11 (ONC RPC / XDR) 仮想計測器 ＆ 補助 Portmapper (TCP 111) リスナー</text>

  <!-- ① デバイス名・Portmapper 設定 -->
  <rect x="38" y="128" width="804" height="122" class="grp" />
  <text x="52" y="149" class="grp-hdr">① 公開デバイス名・Portmapper 応答・仮想 STB レジスタ設定</text>

  <text x="52" y="178" class="lbl">受理デバイス名:</text>
  <rect x="150" y="161" width="180" height="24" class="inp" />
  <text x="160" y="177" class="mono" font-size="11" fill="#0F172A">inst0, gpib0,22</text>

  <text x="348" y="178" class="lbl">既定 STB (HEX):</text>
  <rect x="448" y="161" width="76" height="24" class="inp" />
  <text x="486" y="177" class="mono" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">0x10</text>

  <text x="542" y="178" class="lbl">最大受信長:</text>
  <rect x="614" y="161" width="110" height="24" class="inp" />
  <text x="669" y="177" class="mono" font-size="11" fill="#0F172A" text-anchor="middle">65536 Bytes</text>

  <rect x="52" y="198" width="14" height="14" rx="2" fill="#2563EB" />
  <path d="M 55 205 L 58 208 L 63 201" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="72" y="210" class="ui" font-size="10.8" fill="#1E293B">補助 Portmapper リスナー（TCP 111 / GETPORT -&gt; DEVICE_CORE）を同時起動する</text>

  <rect x="52" y="224" width="14" height="14" rx="2" fill="#2563EB" />
  <path d="M 55 231 L 58 234 L 63 227" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="72" y="236" class="ui" font-size="10.8" fill="#1E293B">mDNS 仮想アドバタイザ有効（_vxi-11._tcp.local）＆ 任意サブアドレス受理</text>

  <!-- ② 対応 RPC プロシージャ許可 -->
  <rect x="38" y="260" width="804" height="94" class="grp" />
  <text x="52" y="281" class="grp-hdr">② 対応 VXI-11 DEVICE_CORE RPC プロシージャ許可設定</text>

  <g transform="translate(52, 294)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 3 7 L 6 10 L 11 3" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
    <text x="20" y="12" class="mono" font-size="10.8" fill="#0F172A">create_link / destroy_link</text>
    <rect x="260" y="0" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 263 7 L 266 10 L 271 3" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
    <text x="280" y="12" class="mono" font-size="10.8" fill="#0F172A">device_write / device_read (END)</text>
    <rect x="560" y="0" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 563 7 L 566 10 L 571 3" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
    <text x="580" y="12" class="mono" font-size="10.8" fill="#0F172A">device_readstb (帯域外)</text>

    <rect x="0" y="28" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 3 35 L 6 38 L 11 31" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
    <text x="20" y="40" class="mono" font-size="10.8" fill="#0F172A">device_clear (クリア)</text>
    <rect x="260" y="28" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 263 35 L 266 38 L 271 31" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
    <text x="280" y="40" class="mono" font-size="10.8" fill="#0F172A">device_trigger (ハードトリガ)</text>
    <rect x="560" y="28" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 563 35 L 566 38 L 571 31" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
    <text x="580" y="40" class="mono" font-size="10.8" fill="#0F172A">device_lock / unlock</text>
  </g>

  <!-- ③ VXI-11 エラーコード模擬 -->
  <rect x="38" y="364" width="804" height="108" rx="5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" />
  <text x="52" y="385" class="ui" font-size="11.5" font-weight="700" fill="#92400E">③ VXI-11 RPC エラーコード異常模擬設定</text>

  <text x="52" y="415" class="lbl">エラー応答:</text>
  <rect x="132" y="398" width="400" height="25" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" rx="3" />
  <text x="142" y="415" class="ui" font-size="11" font-weight="700" fill="#0F172A">0: No Error（正常応答） ▼</text>

  <text x="548" y="415" class="lbl">発動条件:</text>
  <rect x="612" y="398" width="212" height="25" class="inp" />
  <text x="622" y="415" class="ui" font-size="10.8" fill="#334155">常時 / N回周期 / 確率指定 ▼</text>

  <text x="52" y="447" class="sub">選択可能エラー: 3 (Device not accessible) / 11 (Device locked by another link) / 15 (I/O Timeout) / 17 (I/O Error)</text>
  <text x="52" y="463" class="mono" font-size="10" fill="#64748B">実装配置: Apr/Term/ExtAnalysis/TermAnalysis.LxiVxi11/Simulation/LxiVxi11SlaveSimulator.cs</text>
