<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="530" viewBox="0 0 660 530">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .grp-box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.2; rx: 4; }
      .grp-lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .input-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 3; }
      .input-hi { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.3; rx: 3; }
      .btn-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 4; }
      .btn-pri { fill: #2563EB; stroke: #1D4ED8; stroke-width: 1; rx: 4; }
      .callout-box { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.3; rx: 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="660" height="530" fill="#F8FAFC" rx="10" />

  <g transform="translate(26, 20)" filter="url(#winShadow)">
    <rect x="0" y="0" width="608" height="438" rx="6" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.4" />
    <path d="M 0 6 Q 0 0 6 0 L 602 0 Q 608 0 608 6 L 608 30 L 0 30 Z" fill="url(#titleGrad)" />
    <text x="14" y="20" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">通信ポートのプロパティ — [LXI VXI-11] タブ</text>

    <path d="M 14 62 L 14 42 Q 14 38 18 38 L 108 38 Q 112 38 112 42 L 112 62 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    <text x="63" y="53" class="ui" font-size="11.5" fill="#475569" text-anchor="middle">コマンド集</text>
    <path d="M 114 62 L 114 40 Q 114 36 118 36 L 236 36 Q 240 36 240 40 L 240 62 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <text x="177" y="53" class="ui" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">LXI VXI-11</text>

    <rect x="14" y="61" width="580" height="328" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <line x1="115" y1="61" x2="239" y2="61" stroke="#FFFFFF" stroke-width="2" />

    <!-- GroupBox 1: VXI-11 接続先設定 -->
    <rect x="28" y="76" width="552" height="106" class="grp-box" />
    <rect x="38" y="68" width="290" height="16" fill="#FFFFFF" />
    <text x="42" y="80" class="grp-lbl">VXI-11 (ONC RPC / XDR) 接続先設定</text>

    <text x="42" y="108" class="ui" font-size="11" fill="#334155">ホスト / IP アドレス:</text>
    <rect x="158" y="92" width="186" height="24" class="input-hi" />
    <text x="168" y="108" class="mono" font-size="11.5" font-weight="700" fill="#1E3A8A">192.168.1.60</text>
    <rect x="352" y="92" width="106" height="24" class="btn-pri" />
    <text x="405" y="108" class="ui" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">mDNS スキャン</text>
    <rect x="464" y="92" width="102" height="24" class="btn-box" />
    <text x="515" y="108" class="ui" font-size="10.5" font-weight="600" fill="#1E293B" text-anchor="middle">Web UI を開く</text>

    <text x="42" y="146" class="ui" font-size="11" fill="#334155">サブアドレス (Device):</text>
    <rect x="158" y="130" width="144" height="24" class="input-hi" />
    <text x="168" y="146" class="mono" font-size="11.5" font-weight="700" fill="#1E3A8A">inst0</text>
    <text x="310" y="146" class="ui" font-size="10" fill="#64748B">※ GW経由例: gpib0,22</text>

    <text x="434" y="146" class="ui" font-size="11" fill="#334155">Portmapper:</text>
    <rect x="504" y="130" width="62" height="24" class="input-box" />
    <text x="514" y="146" class="mono" font-size="11.5" fill="#0F172A">111</text>

    <text x="42" y="174" class="ui" font-size="10" fill="#475569">VISA 互換表記プレビュー: TCPIP0::192.168.1.60::inst0::INSTR</text>

    <!-- GroupBox 2: RPC タイムアウト・ロック制御 -->
    <rect x="28" y="192" width="552" height="78" class="grp-box" />
    <rect x="38" y="184" width="234" height="16" fill="#FFFFFF" />
    <text x="42" y="196" class="grp-lbl">RPC タイムアウト・排他ロック設定</text>

    <text x="42" y="224" class="ui" font-size="11" fill="#334155">I/O タイムアウト (ms):</text>
    <rect x="164" y="208" width="110" height="24" class="input-box" />
    <text x="174" y="224" class="mono" font-size="11.5" fill="#0F172A">5000</text>

    <text x="296" y="224" class="ui" font-size="11" fill="#334155">ロック待機時間 (ms):</text>
    <rect x="414" y="208" width="110" height="24" class="input-box" />
    <text x="424" y="224" class="mono" font-size="11.5" fill="#0F172A">3000</text>

    <rect x="42" y="244" width="14" height="14" rx="2" fill="#2563EB" />
    <path d="M 45 251 L 48 254 L 53 247" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
    <text x="64" y="255" class="ui" font-size="10.8" fill="#1E293B">接続時 (create_link) に自動で排他ロック要求を発行する</text>

    <!-- GroupBox 3: 接続テスト・LXI 識別 -->
    <rect x="28" y="280" width="552" height="98" class="grp-box" />
    <rect x="38" y="272" width="256" height="16" fill="#FFFFFF" />
    <text x="42" y="284" class="grp-lbl">疎通テスト・帯域外 STB チェック（Lxi.Core）</text>

    <rect x="42" y="298" width="126" height="24" class="btn-box" />
    <text x="105" y="314" class="ui" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">接続テスト (*IDN?)</text>
    <rect x="176" y="298" width="116" height="24" class="btn-box" />
    <text x="234" y="314" class="ui" font-size="10.5" font-weight="600" fill="#1E293B" text-anchor="middle">帯域外 STB 読取</text>
    <text x="304" y="314" class="mono" font-size="10.8" fill="#15803D">✓ LinkID=1 / STB=0x00</text>

    <rect x="42" y="330" width="524" height="38" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="52" y="347" class="mono" font-size="10.5" fill="#1E3A8A">Portmapper 111 -&gt; DEVICE_CORE Port: 1024 (Resolved)</text>
    <text x="52" y="362" class="mono" font-size="10.2" fill="#475569">Supported RPC: device_write, device_read, readstb, clear, trigger, lock</text>

    <rect x="200" y="398" width="96" height="30" class="btn-pri" />
    <text x="248" y="417" class="ui" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">OK</text>
    <rect x="312" y="398" width="96" height="30" class="btn-box" />
    <text x="360" y="417" class="ui" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">キャンセル</text>
  </g>

  <rect x="26" y="470" width="608" height="44" class="callout-box" />
  <text x="42" y="489" class="ui" font-size="11" font-weight="700" fill="#92400E">メイン画面の［通信モード(M)］で「LXI_VXI11」選択時に自動表示</text>
  <text x="42" y="506" class="ui" font-size="10.5" fill="#451A03">・サブアドレスに gpib0,22 等を指定すると、LAN/GPIB ゲートウェイ経由のレガシー機器も制御できます。</text>
</svg>
