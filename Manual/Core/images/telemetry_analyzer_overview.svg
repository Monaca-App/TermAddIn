      .badge-num { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .btn { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 4; }
      .btn-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; fill: #1E293B; text-anchor: middle; }
      .th { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 700; fill: #334155; }
      .td { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; fill: #1E293B; }
