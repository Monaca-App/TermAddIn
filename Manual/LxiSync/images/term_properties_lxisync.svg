<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="530" viewBox="0 0 660 530">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .grp-box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.2; rx: 4; }
      .grp-lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .input-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 3; }
      .input-hi { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.3; rx: 3; }
      .btn-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 4; }
      .btn-pri { fill: #2563EB; stroke: #1D4ED8; stroke-width: 1; rx: 4; }
      .callout-box { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.3; rx: 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="660" height="530" fill="#F8FAFC" rx="10" />

  <g transform="translate(26, 20)" filter="url(#winShadow)">
    <rect x="0" y="0" width="608" height="438" rx="6" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.4" />
    <path d="M 0 6 Q 0 0 6 0 L 602 0 Q 608 0 608 6 L 608 30 L 0 30 Z" fill="url(#titleGrad)" />
    <text x="14" y="20" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">通信ポートのプロパティ — [LXI Sync] タブ</text>

    <path d="M 14 62 L 14 42 Q 14 38 18 38 L 108 38 Q 112 38 112 42 L 112 62 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    <text x="63" y="53" class="ui" font-size="11.5" fill="#475569" text-anchor="middle">コマンド集</text>
    <path d="M 114 62 L 114 40 Q 114 36 118 36 L 230 36 Q 234 36 234 40 L 234 62 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <text x="174" y="53" class="ui" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">LXI Sync</text>

    <rect x="14" y="61" width="580" height="328" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <line x1="115" y1="61" x2="233" y2="61" stroke="#FFFFFF" stroke-width="2" />

    <!-- GroupBox 1: IEEE 1588 PTPv2 監視設定 -->
    <rect x="28" y="76" width="552" height="106" class="grp-box" />
    <rect x="38" y="68" width="292" height="16" fill="#FFFFFF" />
    <text x="42" y="80" class="grp-lbl">IEEE 1588-2008 PTPv2 同期監視設定</text>

    <text x="42" y="108" class="ui" font-size="11" fill="#334155">PTP マルチキャスト:</text>
    <rect x="158" y="92" width="144" height="24" class="input-hi" />
    <text x="168" y="108" class="mono" font-size="11.5" font-weight="700" fill="#1E3A8A">224.0.1.129</text>
    <text x="312" y="108" class="ui" font-size="11" fill="#334155">UDP ポート:</text>
    <rect x="382" y="92" width="84" height="24" class="input-box" />
    <text x="392" y="108" class="mono" font-size="11.5" fill="#0F172A">319 / 320</text>
    <rect x="474" y="92" width="92" height="24" class="btn-pri" />
    <text x="520" y="108" class="ui" font-size="10.2" font-weight="700" fill="#FFFFFF" text-anchor="middle">GM 状態確認</text>

    <text x="42" y="146" class="ui" font-size="11" fill="#334155">PTP ドメイン番号:</text>
    <rect x="158" y="130" width="66" height="24" class="input-box" />
    <text x="168" y="146" class="mono" font-size="11.5" fill="#0F172A">0</text>

    <text x="240" y="146" class="ui" font-size="11" fill="#334155">許容同期オフセット:</text>
    <rect x="352" y="130" width="96" height="24" class="input-box" />
    <text x="362" y="146" class="mono" font-size="11.5" fill="#0F172A">1000 ns</text>

    <text x="462" y="146" class="ui" font-size="11" fill="#334155">未来加算:</text>
    <rect x="516" y="130" width="50" height="24" class="input-box" />
    <text x="522" y="146" class="mono" font-size="11" fill="#0F172A">500ms</text>

    <text x="42" y="174" class="mono" font-size="10.2" fill="#15803D">✓ Grandmaster: 00-80-2F-FF-FE-12-34-56 (Domain=0 / Offset=+18ns / LOCKED)</text>

    <!-- GroupBox 2: Wired Trigger Bus (WTB) 既定構成 -->
    <rect x="28" y="192" width="552" height="94" class="grp-box" />
    <rect x="38" y="184" width="268" height="16" fill="#FFFFFF" />
    <text x="42" y="196" class="grp-lbl">Wired Trigger Bus（WTB: LXI0〜LXI7）設定</text>

    <text x="42" y="224" class="ui" font-size="11" fill="#334155">対象チャネル:</text>
    <rect x="130" y="208" width="84" height="24" class="input-box" />
    <text x="140" y="224" class="mono" font-size="11.5" fill="#0F172A">LXI0 ▼</text>

    <text x="228" y="224" class="ui" font-size="11" fill="#334155">駆動モード:</text>
    <rect x="300" y="208" width="120" height="24" class="input-box" />
    <text x="310" y="224" class="mono" font-size="11.2" fill="#0F172A">Wired-OR ▼</text>

    <text x="432" y="224" class="ui" font-size="11" fill="#334155">極性:</text>
    <rect x="470" y="208" width="96" height="24" class="input-box" />
    <text x="480" y="224" class="mono" font-size="11.2" fill="#0F172A">Positive ▼</text>

    <rect x="42" y="250" width="14" height="14" rx="2" fill="#2563EB" />
    <path d="M 45 257 L 48 260 L 53 253" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
    <text x="64" y="261" class="ui" font-size="10.8" fill="#1E293B">終端抵抗 (100Ω 差動終端) 有効</text>
    <text x="280" y="261" class="ui" font-size="10.5" fill="#475569">入出力方向: Output (Trigger Source)</text>

    <!-- GroupBox 3: Timestamped Data 整列オプション -->
    <rect x="28" y="296" width="552" height="82" class="grp-box" />
    <rect x="38" y="288" width="246" height="16" fill="#FFFFFF" />
    <text x="42" y="300" class="grp-lbl">Timestamped Data 時刻軸整列設定</text>

    <text x="42" y="328" class="ui" font-size="11" fill="#334155">時刻基準:</text>
    <rect x="116" y="312" width="136" height="24" class="input-box" />
    <text x="126" y="328" class="mono" font-size="11.2" fill="#0F172A">TAI (PTP基準) ▼</text>
    <text x="270" y="328" class="ui" font-size="11" fill="#334155">整列許容窓:</text>
    <rect x="348" y="312" width="106" height="24" class="input-box" />
    <text x="358" y="328" class="mono" font-size="11.2" fill="#0F172A">1.000 ms</text>
    <text x="42" y="362" class="ui" font-size="10.2" fill="#475569">複数計測器から回収したタイムスタンプ付き配列を時刻軸で自動マージして Excel セルへ展開します。</text>

    <rect x="200" y="398" width="96" height="30" class="btn-pri" />
    <text x="248" y="417" class="ui" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">OK</text>
    <rect x="312" y="398" width="96" height="30" class="btn-box" />
    <text x="360" y="417" class="ui" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">キャンセル</text>
  </g>

  <rect x="26" y="470" width="608" height="44" class="callout-box" />
  <text x="42" y="489" class="ui" font-size="11" font-weight="700" fill="#92400E">メイン画面の［通信モード(M)］で「LXI_SYNC」選択時に自動表示</text>
  <text x="42" y="506" class="ui" font-size="10.5" fill="#451A03">・専用 PTP グランドマスタ／計測器間 PTP 同期の監視・未来時刻トリガ配布・時刻軸整列に特化した安全設計です。</text>
</svg>
