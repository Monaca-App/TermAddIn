<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="530" viewBox="0 0 660 530">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .grp-box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.2; rx: 4; }
      .grp-lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .input-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 3; }
      .input-hi { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.3; rx: 3; }
      .btn-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 4; }
      .btn-pri { fill: #2563EB; stroke: #1D4ED8; stroke-width: 1; rx: 4; }
      .callout-box { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.3; rx: 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="660" height="530" fill="#F8FAFC" rx="10" />

  <g transform="translate(26, 20)" filter="url(#winShadow)">
    <rect x="0" y="0" width="608" height="438" rx="6" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.4" />
    <path d="M 0 6 Q 0 0 6 0 L 602 0 Q 608 0 608 6 L 608 30 L 0 30 Z" fill="url(#titleGrad)" />
    <text x="14" y="20" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">通信ポートのプロパティ — [LXI Raw] タブ</text>

    <path d="M 14 62 L 14 42 Q 14 38 18 38 L 108 38 Q 112 38 112 42 L 112 62 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    <text x="63" y="53" class="ui" font-size="11.5" fill="#475569" text-anchor="middle">コマンド集</text>
    <path d="M 114 62 L 114 40 Q 114 36 118 36 L 222 36 Q 226 36 226 40 L 226 62 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <text x="170" y="53" class="ui" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">LXI Raw</text>

    <rect x="14" y="61" width="580" height="328" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <line x1="115" y1="61" x2="225" y2="61" stroke="#FFFFFF" stroke-width="2" />

    <!-- GroupBox 1: SCPI Raw Socket 接続先設定 -->
    <rect x="28" y="76" width="552" height="94" class="grp-box" />
    <rect x="38" y="68" width="260" height="16" fill="#FFFFFF" />
    <text x="42" y="80" class="grp-lbl">SCPI Raw Socket 接続先設定（VISA レス）</text>

    <text x="42" y="108" class="ui" font-size="11" fill="#334155">ホスト / IP アドレス:</text>
    <rect x="158" y="92" width="186" height="24" class="input-hi" />
    <text x="168" y="108" class="mono" font-size="11.5" font-weight="700" fill="#1E3A8A">192.168.1.50</text>
    <rect x="352" y="92" width="106" height="24" class="btn-pri" />
    <text x="405" y="108" class="ui" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">mDNS スキャン</text>
    <rect x="464" y="92" width="102" height="24" class="btn-box" />
    <text x="515" y="108" class="ui" font-size="10.5" font-weight="600" fill="#1E293B" text-anchor="middle">Web UI を開く</text>

    <text x="42" y="146" class="ui" font-size="11" fill="#334155">TCP ポート番号:</text>
    <rect x="158" y="130" width="90" height="24" class="input-box" />
    <text x="168" y="146" class="mono" font-size="11.5" fill="#0F172A">5025</text>
    <rect x="256" y="130" width="96" height="24" class="btn-box" />
    <text x="304" y="146" class="ui" font-size="10.5" font-weight="600" fill="#1E293B" text-anchor="middle">標準 (5025)</text>

    <text x="366" y="146" class="ui" font-size="11" fill="#334155">タイムアウト(ms):</text>
    <rect x="466" y="130" width="100" height="24" class="input-box" />
    <text x="476" y="146" class="mono" font-size="11.5" fill="#0F172A">5000</text>

    <!-- GroupBox 2: 電文・バイナリブロック設定 -->
    <rect x="28" y="180" width="552" height="74" class="grp-box" />
    <rect x="38" y="172" width="240" height="16" fill="#FFFFFF" />
    <text x="42" y="184" class="grp-lbl">送受信ターミネータ・バイナリ転送設定</text>

    <text x="42" y="212" class="ui" font-size="11" fill="#334155">送信ターミネータ:</text>
    <rect x="158" y="196" width="110" height="24" class="input-box" />
    <text x="168" y="212" class="mono" font-size="11.5" fill="#0F172A">LF (\n) ▼</text>

    <rect x="288" y="201" width="14" height="14" rx="2" fill="#2563EB" />
    <path d="M 291 208 L 294 211 L 299 204" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
    <text x="308" y="212" class="ui" font-size="11" fill="#1E293B">IEEE 488.2 バイナリブロック解析を有効化</text>

    <rect x="42" y="232" width="14" height="14" rx="2" fill="#2563EB" />
    <path d="M 45 239 L 48 242 L 53 235" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
    <text x="64" y="243" class="ui" font-size="10.8" fill="#1E293B">Auto-IP (169.254.x.x) 直結および IPv4 / IPv6 デュアルスタックを自動解決</text>

    <!-- GroupBox 3: LXI XML 識別情報プレビュー (Lxi.Core 共通) -->
    <rect x="28" y="264" width="552" height="114" class="grp-box" />
    <rect x="38" y="256" width="246" height="16" fill="#FFFFFF" />
    <text x="42" y="268" class="grp-lbl">LXI XML 識別情報・接続テスト（Lxi.Core）</text>

    <rect x="42" y="280" width="128" height="24" class="btn-box" />
    <text x="106" y="296" class="ui" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">接続テスト (*IDN?)</text>
    <text x="182" y="296" class="mono" font-size="10.8" fill="#15803D">✓ KEYSIGHT TECHNOLOGIES,34465A,MY59001234,A.03.01</text>

    <rect x="42" y="312" width="524" height="56" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="52" y="330" class="mono" font-size="10.5" fill="#334155">URL : http://192.168.1.50/lxi/identification</text>
    <text x="52" y="346" class="mono" font-size="10.5" fill="#1E3A8A">Model: 34465A  |  Serial: MY59001234  |  LXI Version: 1.5</text>
    <text x="52" y="362" class="mono" font-size="10.2" fill="#475569">ExtendedFunctions: LXI Event Messaging, LXI Clock Synchronization</text>

    <rect x="200" y="398" width="96" height="30" class="btn-pri" />
    <text x="248" y="417" class="ui" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">OK</text>
    <rect x="312" y="398" width="96" height="30" class="btn-box" />
    <text x="360" y="417" class="ui" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">キャンセル</text>
  </g>

  <rect x="26" y="470" width="608" height="44" class="callout-box" />
  <text x="42" y="489" class="ui" font-size="11" font-weight="700" fill="#92400E">メイン画面の［通信モード(M)］で「LXI_RAW」選択時に自動表示</text>
  <text x="42" y="506" class="ui" font-size="10.5" fill="#451A03">・mDNS スキャン・LXI XML 識別・Web UI 起動は共通基盤 TermAnalysis.Lxi.Core により無償同梱されます。</text>
</svg>
