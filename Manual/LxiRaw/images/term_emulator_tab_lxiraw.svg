    </style>
  </defs>

  <rect x="0" y="0" width="880" height="510" fill="#F8FAFC" rx="10" />
  <text x="24" y="25" class="ui" font-size="13.5" font-weight="700" fill="#0F172A">[LXI Raw] SCPI Raw Socket 仮想計測器タブ画面（TermAnalysis.LxiRaw.dll 内蔵）</text>

  <rect x="632" y="9" width="224" height="22" rx="11" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1" />
  <text x="744" y="24" class="ui" font-size="10.2" font-weight="700" fill="#1D4ED8" text-anchor="middle">✓ TermAddIn_LxiRaw.License 共用</text>

