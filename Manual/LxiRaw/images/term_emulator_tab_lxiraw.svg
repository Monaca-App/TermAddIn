  <line x1="375" y1="66" x2="477" y2="66" stroke="#F8FAFC" stroke-width="2.5" />

  <rect x="38" y="80" width="804" height="38" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
  <text x="54" y="104" class="ui" font-size="11.5" font-weight="700" fill="#1E3A8A">LXI SCPI Raw Socket 仮想計測器（TCP 5025・バイナリ波形・仮想アドバタイザ対応）</text>

  <!-- ① 仮想計測器識別・仮想アドバタイザ -->
  <rect x="38" y="128" width="804" height="122" class="grp" />
  <text x="52" y="149" class="grp-hdr">① 仮想計測器識別（*IDN?）＆ 仮想 LXI アドバタイザ（mDNS / HTTP XML）</text>

  <text x="52" y="178" class="lbl">*IDN? 応答文字列:</text>
  <rect x="166" y="161" width="460" height="24" class="inp" />
  <text x="176" y="177" class="mono" font-size="11" fill="#0F172A">MONACA,LXI-DMM34465-EMU,EMU-0001,1.0.0</text>

  <text x="640" y="178" class="lbl">応答改行:</text>
  <rect x="702" y="161" width="124" height="24" class="inp" />
  <text x="764" y="177" class="mono" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">LF (\n) ▼</text>

  <rect x="52" y="198" width="14" height="14" rx="2" fill="#2563EB" />
  <path d="M 55 205 L 58 208 L 63 201" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="72" y="210" class="ui" font-size="10.8" fill="#1E293B">mDNS 仮想アドバタイザ有効（UDP 5353: _scpi-raw._tcp.local / _lxi._tcp.local 応答）</text>

  <rect x="52" y="224" width="14" height="14" rx="2" fill="#2563EB" />
  <path d="M 55 231 L 58 234 L 63 227" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="72" y="236" class="ui" font-size="10.8" fill="#1E293B">簡易 HTTP Identification 応答有効（http://127.0.0.1:8080/lxi/identification）</text>

  <!-- ② SCPI 応答・バイナリ波形設定 -->
  <rect x="38" y="260" width="804" height="94" class="grp" />
  <text x="52" y="281" class="grp-hdr">② SCPI コマンド応答 ＆ IEEE 488.2 バイナリブロック模擬設定</text>

  <g transform="translate(52, 294)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 3 7 L 6 10 L 11 3" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
    <text x="20" y="12" class="mono" font-size="10.8" fill="#0F172A">IEEE 488.2 共通命令 (*IDN? / *RST / *CLS / *OPC? / *STB?)</text>

    <rect x="440" y="0" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 443 7 L 446 10 L 451 3" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
    <text x="460" y="12" class="mono" font-size="10.8" fill="#0F172A">SYST:ERR? エラーキュー模擬</text>

    <rect x="0" y="28" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 3 35 L 6 38 L 11 31" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
    <text x="20" y="40" class="mono" font-size="10.8" fill="#0F172A">バイナリ波形ブロック応答 (WAV:DATA? -&gt; #41024&lt;sine_wave&gt;)</text>

    <rect x="440" y="28" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 443 35 L 446 38 L 451 31" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
    <text x="460" y="40" class="ui" font-size="10.8" fill="#0F172A">基本タブ②「自動応答ルール」と連携</text>
  </g>

  <!-- ③ SCPI エラー・異常模擬 -->
  <rect x="38" y="364" width="804" height="108" rx="5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" />
  <text x="52" y="385" class="ui" font-size="11.5" font-weight="700" fill="#92400E">③ SCPI エラーキュー（SYST:ERR?）およびバイナリ破損異常模擬</text>

  <text x="52" y="415" class="lbl">エラー注入:</text>
  <rect x="132" y="398" width="400" height="25" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" rx="3" />
  <text x="142" y="415" class="ui" font-size="11" font-weight="700" fill="#0F172A">0,"No error"（正常動作） ▼</text>

  <text x="548" y="415" class="lbl">発動条件:</text>
  <rect x="612" y="398" width="212" height="25" class="inp" />
  <text x="622" y="415" class="ui" font-size="10.8" fill="#334155">常時 / N回周期 / 確率指定 ▼</text>

  <text x="52" y="447" class="sub">模擬可能エラー: -113 Undefined header / -222 Data out of range / -410 Query INTERRUPTED / バイナリ長不整合</text>
  <text x="52" y="463" class="mono" font-size="10" fill="#64748B">実装配置: Apr/Term/ExtAnalysis/TermAnalysis.LxiRaw/Simulation/LxiRawSlaveSimulator.cs</text>
